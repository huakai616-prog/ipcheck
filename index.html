<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>IP 体检</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="description" content="在手机浏览器里看 AI 出口是否绝对干净（多数据源交叉验证），视频、TikTok、其他外网线路的延迟和带宽。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IP 体检">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --label: #1c1c1e; --label2: rgba(60,60,67,.74); --label3: rgba(60,60,67,.52); --sep: rgba(60,60,67,.14);
  --glass: rgba(255,255,255,.44); --glass-strong: rgba(255,255,255,.72); --tile: rgba(255,255,255,.5);
  --edge: rgba(255,255,255,.8); --hi: inset 0 1px 0 rgba(255,255,255,.9);
  --shadow: 0 12px 32px rgba(35,45,90,.10), 0 1px 3px rgba(35,45,90,.06);
  --blur: blur(30px) saturate(190%);
  --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --gray: #8e8e93;
  /* 浅色底上用加深的「墨色」写字，系统亮色直接做文字对比度不够 */
  --blue-ink: #0064d1; --green-ink: #1f8a3c; --orange-ink: #b85c00; --red-ink: #d70015; --gray-ink: #636366;
  --blue-tint: rgba(0,122,255,.12); --green-tint: rgba(52,199,89,.16); --orange-tint: rgba(255,149,0,.16);
  --red-tint: rgba(255,59,48,.13); --gray-tint: rgba(142,142,147,.16);
  --base: #e8edf8; --b1: #5aa8ff; --b2: #b08cff; --b3: #6ddfc0; --b4: #ffb28a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: #f5f5f7; --label2: rgba(235,235,245,.72); --label3: rgba(235,235,245,.46); --sep: rgba(255,255,255,.11);
    --glass: rgba(28,30,40,.46); --glass-strong: rgba(40,42,54,.85); --tile: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.13); --hi: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 12px 32px rgba(0,0,0,.38);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --gray: #98989d;
    --blue-ink: #5eb0ff; --green-ink: #3ddc6a; --orange-ink: #ffb340; --red-ink: #ff6961; --gray-ink: #aeaeb2;
    --blue-tint: rgba(10,132,255,.2); --green-tint: rgba(48,209,88,.18); --orange-tint: rgba(255,159,10,.18);
    --red-tint: rgba(255,69,58,.18); --gray-tint: rgba(152,152,157,.18);
    --base: #05060b; --b1: #2560d6; --b2: #7a3fe0; --b3: #0d8a73; --b4: #a24f2c;
    color-scheme: dark;
  }
}
/* 背景色块随结论变色：干净偏绿、中等偏橙、高风险偏红 */
body[data-tone="ok"] { --b3: #5ddc8c; }
body[data-tone="warn"] { --b4: #ffbf5e; }
body[data-tone="bad"] { --b4: #ff7a6e; --b2: #ff8db0; }
@media (prefers-color-scheme: dark) {
  body[data-tone="ok"] { --b3: #138a47; }
  body[data-tone="warn"] { --b4: #a06a12; }
  body[data-tone="bad"] { --b4: #a3261f; --b2: #8a2457; }
}

* { box-sizing: border-box; }
html { background: var(--base); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  /* 底色只放在 html 上：body 自己有背景会盖住 z-index 为负的背景色块 */
  color: var(--label); background: transparent; margin: 0 auto; max-width: 980px; min-height: 100vh;
  padding: calc(28px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
a { color: var(--blue-ink); }
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }

/* ─── 背景：几团柔边色块，给毛玻璃透出颜色 ───
   用径向渐变画柔边，不用 filter: blur：大面积模糊滤镜在 iPhone 上滚动时很吃 GPU */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; transform: translateZ(0); }
.bg i { position: absolute; width: 100vmax; height: 100vmax; opacity: .9;
  background: radial-gradient(closest-side, currentColor 38%, transparent); transition: color 1.2s ease; }
@media (prefers-color-scheme: dark) { .bg i { opacity: .6; } }
.bg i:nth-child(1) { color: var(--b1); top: -33vmax; left: -43vmax; }
.bg i:nth-child(2) { color: var(--b2); top: calc(8vh - 15vmax); right: -49vmax; }
.bg i:nth-child(3) { color: var(--b3); bottom: -39vmax; left: -35vmax; }
.bg i:nth-child(4) { color: var(--b4); top: calc(52vh - 16vmax); right: -38vmax; width: 84vmax; height: 84vmax; }

/* ─── 毛玻璃卡片：只给顶层几块，折叠区里面的内容用普通浅底 ─── */
.blk, .progress, .fatal, .diag-box, details.settings, details.more {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--edge); border-radius: 22px;
  box-shadow: var(--shadow), var(--hi);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark) { :root { --glass: rgba(34,36,46,.94); } }
}
/* iOS 风格的内缩分隔线 */
.ex-row {
  background-image: linear-gradient(var(--sep), var(--sep));
  background-size: calc(100% - 18px) 1px; background-position: right top; background-repeat: no-repeat;
}

/* ─── 顶栏 ─── */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 4px 18px; }
.page-title { font-size: 34px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; margin: 0; }
.page-sub { font-size: 14px; color: var(--label2); margin-top: 4px; }
.rerun-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 11px 22px; font: inherit; font-size: 16px; font-weight: 600; color: #fff;
  background: rgba(0,122,255,.88); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; cursor: pointer;
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 8px 24px rgba(0,122,255,.28), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .15s ease, opacity .2s ease;
}
.rerun-btn .rr-icon { font-size: 18px; line-height: 1; }
.rerun-btn:active { transform: scale(.96); }
.rerun-btn:disabled { opacity: .5; cursor: default; }
.rerun-btn:disabled .rr-icon { animation: spin .9s linear infinite; display: inline-block; }

/* ─── 检测进度 ─── */
.progress { padding: 20px 22px; }
.pg-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.pg-title::before {
  content: ""; width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid var(--sep); border-top-color: var(--blue); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pg-log { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; color: var(--label2); }
.pg-log li { padding: 3px 0; }
.pg-log .ok { color: var(--green-ink); } .pg-log .bad { color: var(--red-ink); }
.fatal { padding: 18px 20px; color: var(--red-ink); font-weight: 600;
  background: linear-gradient(var(--red-tint), var(--red-tint)), var(--glass); }
.fatal .diag-body { color: var(--label2); font-weight: 400; margin-top: 6px; }

/* ─── 首屏三块：AI 出口 / 视频媒体 / 其他外网（10-26 简化）─── */
.blk { padding: 18px 20px 16px; margin-bottom: 14px; }
.blk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 12px; }
.blk-title { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
.blk-hint { font-size: 12px; color: var(--label3); text-align: right; }

/* AI 出口：大结论 + 四项检查 */
.ai-status { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; }
.ai-status.v-ok { background: var(--green-tint); color: var(--green-ink); }
.ai-status.v-warn { background: var(--orange-tint); color: var(--orange-ink); }
.ai-status.v-bad { background: var(--red-tint); color: var(--red-ink); }
.ai-status.v-unk { background: var(--gray-tint); color: var(--gray-ink); }
.v-mark { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; font-size: 18px; font-weight: 700; background: var(--gray); }
.v-ok .v-mark { background: var(--green); } .v-warn .v-mark { background: var(--orange); } .v-bad .v-mark { background: var(--red); }
.v-level { font-size: 22px; font-weight: 700; line-height: 1.25; }
.v-sentence { font-size: 14px; font-weight: 500; color: var(--label); opacity: .82; margin-top: 1px; }
.chk-list { list-style: none; margin: 10px 0 0; padding: 0; }
.chk { display: grid; grid-template-columns: 22px auto minmax(0, 1fr); gap: 1px 10px; align-items: baseline; padding: 10px 2px; }
.chk + .chk { border-top: 1px solid var(--sep); }
.chk-mark { font-size: 15px; font-weight: 800; text-align: center; }
.chk-label { font-size: 15px; font-weight: 600; white-space: nowrap; }
.chk-text { font-size: 13px; color: var(--label2); text-align: right; overflow-wrap: anywhere; }
.c-ok .chk-mark { color: var(--green-ink); } .c-warn .chk-mark, .c-warn .chk-text { color: var(--orange-ink); }
.c-bad .chk-mark, .c-bad .chk-text { color: var(--red-ink); } .c-unk .chk-mark { color: var(--gray-ink); }
.ai-exit { margin-top: 4px; padding: 12px 2px 0; border-top: 1px solid var(--sep); font-size: 13px; color: var(--label2); overflow-wrap: anywhere; }
.ai-exit .mono { font-size: 15px; font-weight: 600; color: var(--label); margin-right: 4px; }
.ai-down-text { margin-top: 12px; font-size: 14px; color: var(--label2); line-height: 1.7; }
.gpt-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; margin-top: 12px; padding: 11px 14px;
  border-radius: 14px; background: var(--tile); font-size: 14px; }
.gpt-name { font-weight: 700; }
.gpt-state { font-weight: 700; } .gpt-state.v-ok { color: var(--green-ink); } .gpt-state.v-bad { color: var(--red-ink); }
.gpt-state.v-unk { color: var(--gray-ink); }
.gpt-det { color: var(--label2); font-size: 13px; overflow-wrap: anywhere; }
.gpt-note { flex-basis: 100%; font-size: 12px; color: var(--label3); }
.gpt-row.gpt-bad { background: var(--red-tint); }
.relay { margin-top: 12px; padding: 11px 14px; border-radius: 14px; background: var(--orange-tint); color: var(--orange-ink); font-size: 13px; line-height: 1.65; }

/* ─── 评分依据（AI 出口里展开）─── */
details.why { margin-top: 14px; border-top: 1px solid var(--sep); }
details.why > summary { padding: 13px 2px 0; font-size: 15px; }
details.why > summary .sum-hint { font-size: 12px; font-weight: 400; color: var(--label3); margin-left: auto; margin-right: 8px; }
.why-body { padding: 10px 0 0; }
.why-formula { font-size: 12px; color: var(--label2); line-height: 1.7; background: var(--tile); border-radius: 14px; padding: 10px 13px; }
.bd-list { margin-top: 6px; }
.bd-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 10px 2px; align-items: baseline; }
.bd-row + .bd-row { border-top: 1px solid var(--sep); }
.bd-k { font-size: 14px; font-weight: 600; }
.bd-tag { display: inline-block; font-size: 12px; font-weight: 700; margin-left: 6px; padding: 0 8px; border-radius: 999px; line-height: 20px; }
.t-ok { color: var(--green-ink); background: var(--green-tint); } .t-bad { color: var(--red-ink); background: var(--red-tint); }
.t-warn { color: var(--orange-ink); background: var(--orange-tint); } .t-info { color: var(--blue-ink); background: var(--blue-tint); }
.t-unk { color: var(--gray-ink); background: var(--gray-tint); }
.bd-pts { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bd-pts.zero { color: var(--label3); font-weight: 500; }
.bd-sub { grid-column: 1 / -1; font-size: 12px; color: var(--label3); overflow-wrap: anywhere; }
.bd-total { border-top: 1.5px solid var(--label3) !important; }
.bd-total .bd-k, .bd-total .bd-pts { font-size: 15px; }
.why-h { font-size: 13px; font-weight: 700; color: var(--label2); margin: 14px 2px 4px; }
.src-agree { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.src-agree li { display: flex; gap: 8px; padding: 5px 2px; }
.src-agree .sa-mark { flex: none; width: 16px; text-align: center; font-weight: 700; }
.src-agree .sa-ok { color: var(--green-ink); } .src-agree .sa-no { color: var(--orange-ink); } .src-agree .sa-fail { color: var(--red-ink); }
.src-agree .sa-name { flex: none; font-weight: 600; min-width: 76px; }
.src-agree .sa-txt { color: var(--label2); overflow-wrap: anywhere; }

/* ─── 视频媒体 / 其他外网：每条线路一行，延迟、带宽、评级 ─── */
.sp-row { display: grid; grid-template-columns: minmax(0, 1.6fr) 96px 112px minmax(110px, 1fr);
  grid-template-areas: "name lat bw grade" "notes notes notes notes"; gap: 2px 14px; align-items: center; padding: 12px 2px; }
.sp-row + .sp-row { border-top: 1px solid var(--sep); }
.sp-name { grid-area: name; min-width: 0; } .sp-lat { grid-area: lat; } .sp-bw { grid-area: bw; }
.sp-grade { grid-area: grade; } .sp-notes { grid-area: notes; }
.sp-title { font-size: 16px; font-weight: 700; }
.sp-sub { font-size: 12px; color: var(--label3); margin-top: 1px; overflow-wrap: anywhere; }
.sp-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
.sp-v small { font-size: 12px; font-weight: 600; color: var(--label2); margin-left: 3px; }
.sp-v.none { color: var(--label3); }
.sp-k { font-size: 11px; color: var(--label3); margin-top: 1px; }
.sp-grade { justify-self: end; text-align: right; padding: 7px 12px; border-radius: 13px; font-size: 16px; font-weight: 700; line-height: 1.3; }
.sp-grade span { display: block; font-size: 11px; font-weight: 500; opacity: .9; }
.g-fast { background: var(--green-tint); color: var(--green-ink); } .g-ok { background: var(--orange-tint); color: var(--orange-ink); }
.g-slow { background: var(--red-tint); color: var(--red-ink); } .g-unknown { background: var(--gray-tint); color: var(--gray-ink); }
.sp-note { font-size: 12px; line-height: 1.6; margin-top: 4px; }
.sp-note.n-warn { color: var(--orange-ink); font-weight: 600; } .sp-note.n-info { color: var(--label3); }
.ln-banner { padding: 11px 14px; margin-bottom: 8px; border-radius: 14px; font-size: 13px; font-weight: 600; line-height: 1.65;
  color: var(--orange-ink); background: var(--orange-tint); }
.run-meta { text-align: center; font-size: 12px; color: var(--label3); margin: 2px 0 0; }

/* 「详细数据」里的小字 */
.rt-sub { font-size: 12px; color: var(--label2); font-weight: 400; margin-top: 3px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
.lv-ok { color: var(--green-ink); font-weight: 600; } .lv-warn { color: var(--orange-ink); font-weight: 600; }
.lv-bad { color: var(--red-ink); font-weight: 600; } .lv-unk { color: var(--gray-ink); font-weight: 600; }

/* ─── 历史对比 ─── */
.diag-box { padding: 16px 18px; margin: 0 0 14px; }
.diag-flat { background: var(--tile); border-radius: 16px; padding: 13px 15px; }
.diag-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.diag-title::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.diag-body { font-size: 14px; line-height: 1.7; color: var(--label); }
.diag-meta { font-size: 12px; color: var(--label3); margin-top: 8px; line-height: 1.65; }
.diag-ok .diag-title { color: var(--green-ink); } .diag-warn .diag-title { color: var(--orange-ink); }
.diag-bad .diag-title { color: var(--red-ink); } .diag-info .diag-title { color: var(--blue-ink); }

/* ─── 数据源卡片（在「详细数据」里）─── */
.src-card { margin-bottom: 10px; overflow: hidden; background: var(--tile); border-radius: 16px; }
.src-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--sep); }
.src-title { font-size: 17px; font-weight: 700; }
.src-sub { font-size: 12px; color: var(--label3); }
.src-link { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--blue-ink); text-decoration: none;
  background: var(--blue-tint); padding: 4px 11px; border-radius: 999px; }
.kv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.kv-table td { padding: 8px 18px; border-bottom: 1px solid var(--sep); vertical-align: top; }
.kv-table tr:last-child td { border-bottom: none; }
.kv-k { color: var(--label2); width: 32%; }
.kv-v { overflow-wrap: anywhere; }
.kv-v.kv-bad { color: var(--red-ink); font-weight: 600; }
.kv-v.kv-ok { color: var(--green-ink); }
.kv-v.kv-nested { padding: 4px 8px 8px; }
.kv-v.kv-nested .kv-table { background: var(--tile); border-radius: 12px; }
.kv-v.kv-nested .kv-table td { padding: 7px 12px; }
.kv-list { margin: 0; padding-left: 18px; }
.src-err { padding: 16px 18px; color: var(--red-ink); font-size: 13px; }

/* ─── 外部网站 ─── */
.ex-list { display: grid; grid-template-columns: repeat(2, 1fr); overflow: hidden; background: var(--tile); border-radius: 16px; }
.ex-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; text-decoration: none; color: var(--label); }
.ex-row:nth-child(-n+2) { background-image: none; }
.ex-row:active { background-color: var(--tile); }
.ex-name { font-size: 15px; font-weight: 600; min-width: 120px; }
.ex-desc { font-size: 12px; color: var(--label2); flex: 1; }
.ex-arrow { color: var(--label3); font-size: 22px; line-height: 1; }

/* ─── 折叠区：评分依据 / 详细数据 / 设置 ─── */
details.more, details.settings { margin-top: 18px; }
details summary { list-style: none; cursor: pointer; padding: 15px 18px; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "›"; font-size: 22px; line-height: 1; color: var(--label3); transition: transform .2s ease; }
details[open] > summary::after { transform: rotate(90deg); }
details.more > summary .sum-hint { font-size: 12px; font-weight: 400; color: var(--label3); margin-left: auto; margin-right: 10px; text-align: right; }
.more-body { padding: 0 12px 14px; }
.more-h { font-size: 13px; font-weight: 700; color: var(--label2); margin: 14px 6px 8px; }
.more-body > .more-h:first-child { margin-top: 2px; }
.more-h .st-hint { font-weight: 400; color: var(--label3); }
.more-note { font-size: 12px; color: var(--label3); margin: 0 6px 10px; line-height: 1.7; }
details.raw { background: var(--tile); border-radius: 16px; margin-top: 10px; }
details.raw > summary { padding: 12px 15px; font-size: 14px; }
details.raw pre { margin: 0; padding: 0 15px 15px; font-size: 11px; overflow: auto; max-height: 480px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--label2); }
.settings-body { padding: 0 18px 18px; }
.set-label { font-size: 13px; font-weight: 600; color: var(--label2); }
.set-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.set-row input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px;
  border: 1px solid var(--sep); border-radius: 12px; background: var(--tile); color: var(--label); }
.set-row input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
.btn { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--sep); background: var(--tile); color: var(--blue-ink); }

async function fetchText(url, method = "GET") {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), TIMEOUT);
  try {
    const r = await fetch(url, { method, cache: "no-store", credentials: "omit", signal: ac.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.text();
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error(`超过 ${TIMEOUT / 1000} 秒未返回`);

    throw e;
  } finally {
    clearTimeout(timer);
  }
