<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>IP 体检</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="description" content="在手机浏览器里检测当前网络出口 IP 的纯净度：多数据源交叉验证、分流出口、历史对比。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IP 体检">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --label: #1c1c1e; --label2: rgba(60,60,67,.74); --label3: rgba(60,60,67,.52); --sep: rgba(60,60,67,.14);
  --glass: rgba(255,255,255,.44); --glass-strong: rgba(255,255,255,.72); --tile: rgba(255,255,255,.5);
  --edge: rgba(255,255,255,.8); --hi: inset 0 1px 0 rgba(255,255,255,.9);
  --shadow: 0 12px 32px rgba(35,45,90,.10), 0 1px 3px rgba(35,45,90,.06);
  --blur: blur(30px) saturate(190%);
  --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --gray: #8e8e93;
  /* 浅色底上用加深的「墨色」写字，系统亮色直接做文字对比度不够 */
  --blue-ink: #0064d1; --green-ink: #1f8a3c; --orange-ink: #b85c00; --red-ink: #d70015; --gray-ink: #636366;
  --blue-tint: rgba(0,122,255,.12); --green-tint: rgba(52,199,89,.16); --orange-tint: rgba(255,149,0,.16);
  --red-tint: rgba(255,59,48,.13); --gray-tint: rgba(142,142,147,.16);
  --base: #e8edf8; --b1: #5aa8ff; --b2: #b08cff; --b3: #6ddfc0; --b4: #ffb28a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: #f5f5f7; --label2: rgba(235,235,245,.72); --label3: rgba(235,235,245,.46); --sep: rgba(255,255,255,.11);
    --glass: rgba(28,30,40,.46); --glass-strong: rgba(40,42,54,.85); --tile: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.13); --hi: inset 0 1px 0 rgba(255,255,255,.07);
    --shadow: 0 12px 32px rgba(0,0,0,.38);
    --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --gray: #98989d;
    --blue-ink: #5eb0ff; --green-ink: #3ddc6a; --orange-ink: #ffb340; --red-ink: #ff6961; --gray-ink: #aeaeb2;
    --blue-tint: rgba(10,132,255,.2); --green-tint: rgba(48,209,88,.18); --orange-tint: rgba(255,159,10,.18);
    --red-tint: rgba(255,69,58,.18); --gray-tint: rgba(152,152,157,.18);
    --base: #05060b; --b1: #2560d6; --b2: #7a3fe0; --b3: #0d8a73; --b4: #a24f2c;
    color-scheme: dark;
  }
}
/* 背景色块随结论变色：干净偏绿、中等偏橙、高风险偏红 */
body[data-tone="ok"] { --b3: #5ddc8c; }
body[data-tone="warn"] { --b4: #ffbf5e; }
body[data-tone="bad"] { --b4: #ff7a6e; --b2: #ff8db0; }
@media (prefers-color-scheme: dark) {
  body[data-tone="ok"] { --b3: #138a47; }
  body[data-tone="warn"] { --b4: #a06a12; }
  body[data-tone="bad"] { --b4: #a3261f; --b2: #8a2457; }
}

* { box-sizing: border-box; }
html { background: var(--base); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  /* 底色只放在 html 上：body 自己有背景会盖住 z-index 为负的背景色块 */
  color: var(--label); background: transparent; margin: 0 auto; max-width: 980px; min-height: 100vh;
  padding: calc(28px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
a { color: var(--blue-ink); }
.mono, .hero-ip, .rt-ip { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }

/* ─── 背景：几团模糊的色块，给毛玻璃透出颜色 ─── */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(64px); opacity: .9;
  transition: background-color 1.2s ease; }
@media (prefers-color-scheme: dark) { .bg i { opacity: .6; } }
.bg i:nth-child(1) { background: var(--b1); top: -18vmax; left: -28vmax; }
.bg i:nth-child(2) { background: var(--b2); top: 8vh; right: -34vmax; }
.bg i:nth-child(3) { background: var(--b3); bottom: -24vmax; left: -20vmax; }
.bg i:nth-child(4) { background: var(--b4); top: 52vh; right: -22vmax; width: 52vmax; height: 52vmax; }

/* ─── 毛玻璃卡片 ─── */
.hero, .progress, .fatal, .rt-list, .rg-grid, .sum-col, .src-card, .ex-list, .diag-box, details.settings, #report details {
  background: var(--glass);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--edge); border-radius: 22px;
  box-shadow: var(--shadow), var(--hi);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root { --glass: rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark) { :root { --glass: rgba(34,36,46,.94); } }
}
/* iOS 风格的内缩分隔线 */
.rt-row + .rt-row, .ex-row, .sum-row + .sum-row {
  background-image: linear-gradient(var(--sep), var(--sep));
  background-size: calc(100% - 18px) 1px; background-position: right top; background-repeat: no-repeat;
}

/* ─── 顶栏 ─── */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 4px 18px; }
.page-title { font-size: 34px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; margin: 0; }
.page-sub { font-size: 14px; color: var(--label2); margin-top: 4px; }
.rerun-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 11px 22px; font: inherit; font-size: 16px; font-weight: 600; color: #fff;
  background: rgba(0,122,255,.88); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; cursor: pointer;
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 8px 24px rgba(0,122,255,.28), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .15s ease, opacity .2s ease;
}
.rerun-btn .rr-icon { font-size: 18px; line-height: 1; }
.rerun-btn:active { transform: scale(.96); }
.rerun-btn:disabled { opacity: .5; cursor: default; }
.rerun-btn:disabled .rr-icon { animation: spin .9s linear infinite; display: inline-block; }

/* ─── 检测进度 ─── */
.progress { padding: 20px 22px; }
.pg-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.pg-title::before {
  content: ""; width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid var(--sep); border-top-color: var(--blue); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pg-log { list-style: none; margin: 12px 0 0; padding: 0; font-size: 14px; color: var(--label2); }
.pg-log li { padding: 3px 0; }
.pg-log .ok { color: var(--green-ink); } .pg-log .bad { color: var(--red-ink); }
.fatal { padding: 18px 20px; color: var(--red-ink); font-weight: 600;
  background: linear-gradient(var(--red-tint), var(--red-tint)), var(--glass); }
.fatal .diag-body { color: var(--label2); font-weight: 400; margin-top: 6px; }

/* ─── 主卡片 ─── */
.hero { padding: 22px 22px 18px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.hero-ip-block { flex: 1 1 auto; min-width: 0; }
.hero-label { font-size: 13px; color: var(--label2); font-weight: 500; }
.hero-ip { font-size: 36px; font-weight: 600; letter-spacing: -.5px; word-break: break-all; margin-top: 2px; line-height: 1.2; }
.hero-score-block { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ring { --c: var(--gray); --p: 0; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--sep) 0); }
.ring.v-ok { --c: var(--green); } .ring.v-warn { --c: var(--orange); } .ring.v-bad { --c: var(--red); }
.ring-in { width: 70px; height: 70px; border-radius: 50%; background: var(--glass-strong); display: grid; place-content: center; text-align: center; }
.hero-score { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-score.v-ok { color: var(--green-ink); } .hero-score.v-warn { color: var(--orange-ink); }
.hero-score.v-bad { color: var(--red-ink); } .hero-score.v-unk { color: var(--gray-ink); }
.ring-cap { font-size: 10px; color: var(--label3); margin-top: 3px; }
.hero-score-label { font-size: 11px; color: var(--label3); }
.hero-verdict {
  margin-top: 18px; padding: 13px 16px; border-radius: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.hero-verdict.v-ok { background: var(--green-tint); color: var(--green-ink); }
.hero-verdict.v-warn { background: var(--orange-tint); color: var(--orange-ink); }
.hero-verdict.v-bad { background: var(--red-tint); color: var(--red-ink); }
.hero-verdict.v-unk { background: var(--gray-tint); color: var(--gray-ink); }
.v-mark { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; font-size: 15px; font-weight: 700; background: var(--gray); }
.v-ok .v-mark { background: var(--green); } .v-warn .v-mark { background: var(--orange); } .v-bad .v-mark { background: var(--red); }
.v-level { font-size: 18px; font-weight: 700; }
.v-sep { display: none; }
.v-sentence { font-size: 15px; font-weight: 500; color: var(--label); opacity: .85; }
.relay { margin-top: 12px; padding: 11px 14px; border-radius: 14px; background: var(--orange-tint); color: var(--orange-ink); font-size: 13px; line-height: 1.65; }
.hero-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--sep); }
.hm-k { font-size: 12px; color: var(--label2); }
.hm-v { font-size: 15px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }

/* ─── 区段标题 ─── */
.section-title { font-size: 21px; font-weight: 700; margin: 30px 6px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title .st-hint { font-size: 13px; font-weight: 400; color: var(--label3); text-align: right; }

/* ─── 风险格 ─── */
.rg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
.rg-cell { background: var(--tile); border-radius: 16px; padding: 14px 15px; }
.rg-cell-wide { grid-column: span 2; }
.rg-label { font-size: 13px; color: var(--label2); }
.rg-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.rg-ok { color: var(--green-ink); } .rg-bad { color: var(--red-ink); } .rg-warn { color: var(--orange-ink); }
.rg-unk { color: var(--gray-ink); } .rg-info { color: var(--blue-ink); }
.rg-hint { font-size: 12px; color: var(--label3); margin-top: 2px; }
.rg-votes { font-size: 11px; color: var(--label3); margin-top: 2px; overflow-wrap: anywhere; }

/* ─── 分流出口 ─── */
.rt-list { overflow: hidden; }
.rt-row { display: grid; grid-template-columns: 140px 1fr 1.1fr; gap: 16px; align-items: start; padding: 14px 18px; }
.rt-name { font-size: 16px; font-weight: 600; }
.rt-ip { font-size: 15px; font-weight: 600; word-break: break-all; }
.rt-sub { font-size: 12px; color: var(--label2); font-weight: 400; margin-top: 3px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
.rt-verdict b { font-size: 15px; }
.rt-verdict.v-ok { color: var(--green-ink); } .rt-verdict.v-warn { color: var(--orange-ink); }
.rt-verdict.v-bad { color: var(--red-ink); } .rt-verdict.v-unk { color: var(--gray-ink); }
.rt-note { font-size: 12px; color: var(--label3); margin: 8px 6px 0; }

/* ─── 历史对比 ─── */
.diag-box { padding: 16px 18px; }
.diag-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.diag-title::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.diag-body { font-size: 14px; line-height: 1.7; color: var(--label); }
.diag-meta { font-size: 12px; color: var(--label3); margin-top: 8px; line-height: 1.65; }
.diag-ok .diag-title { color: var(--green-ink); } .diag-warn .diag-title { color: var(--orange-ink); }
.diag-bad .diag-title { color: var(--red-ink); } .diag-info .diag-title { color: var(--blue-ink); }

/* ─── 综合摘要 ─── */
.sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.sum-col { padding: 16px 0 8px; }
.sum-title { font-size: 15px; font-weight: 700; padding: 0 18px 8px; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 18px; font-size: 14px; }
.sum-k { color: var(--label2); white-space: nowrap; }
.sum-v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

/* ─── 数据源卡片 ─── */
.src-card { margin-bottom: 12px; overflow: hidden; }
.src-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--sep); }
.src-title { font-size: 17px; font-weight: 700; }
.src-sub { font-size: 12px; color: var(--label3); }
.src-link { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--blue-ink); text-decoration: none;
  background: var(--blue-tint); padding: 4px 11px; border-radius: 999px; }
.kv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.kv-table td { padding: 8px 18px; border-bottom: 1px solid var(--sep); vertical-align: top; }
.kv-table tr:last-child td { border-bottom: none; }
.kv-k { color: var(--label2); width: 32%; }
.kv-v { overflow-wrap: anywhere; }
.kv-v.kv-bad { color: var(--red-ink); font-weight: 600; }
.kv-v.kv-ok { color: var(--green-ink); }
.kv-v.kv-nested { padding: 4px 8px 8px; }
.kv-v.kv-nested .kv-table { background: var(--tile); border-radius: 12px; }
.kv-v.kv-nested .kv-table td { padding: 7px 12px; }
.kv-list { margin: 0; padding-left: 18px; }
.src-err { padding: 16px 18px; color: var(--red-ink); font-size: 13px; }

/* ─── 外部网站 ─── */
.ex-list { display: grid; grid-template-columns: repeat(2, 1fr); overflow: hidden; }
.ex-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; text-decoration: none; color: var(--label); }
.ex-row:nth-child(-n+2) { background-image: none; }
.ex-row:active { background-color: var(--tile); }
.ex-name { font-size: 15px; font-weight: 600; min-width: 120px; }
.ex-desc { font-size: 12px; color: var(--label2); flex: 1; }
.ex-arrow { color: var(--label3); font-size: 22px; line-height: 1; }

/* ─── 折叠区：原始数据 / 设置 ─── */
details { margin-top: 18px; }
details summary { list-style: none; cursor: pointer; padding: 15px 18px; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "›"; font-size: 22px; line-height: 1; color: var(--label3); transition: transform .2s ease; }
details[open] summary::after { transform: rotate(90deg); }
#report details pre { margin: 0; padding: 0 18px 18px; font-size: 11px; overflow: auto; max-height: 480px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--label2); }
.settings-body { padding: 0 18px 18px; }
.set-label { font-size: 13px; font-weight: 600; color: var(--label2); }
.set-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.set-row input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px;
  border: 1px solid var(--sep); border-radius: 12px; background: var(--tile); color: var(--label); }
.set-row input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
.btn { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--sep); background: var(--tile); color: var(--blue-ink); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--blue); border-color: transparent; color: #fff; }
.set-hint { font-size: 12px; color: var(--label3); margin-top: 8px; line-height: 1.7; }
.set-sep { border-top: 1px solid var(--sep); margin: 16px 0 12px; }
.set-switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; font-weight: 600; }
.set-switch input { flex: none; margin: 0; accent-color: var(--green); } /* 不定尺寸：iPhone 上是系统开关，定了会被压扁 */

.footer { text-align: center; color: var(--label3); font-size: 12px; margin-top: 32px; line-height: 1.8; }
.credit { font-size: 11px; color: var(--label3); margin-top: 6px; letter-spacing: 4px; }

@media (prefers-reduced-motion: reduce) { .bg i { transition: none; } }

@media (max-width: 680px) {
  body { padding: calc(14px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom)); }
  .page-title { font-size: 30px; }
  .page-sub { font-size: 13px; }
  /* 手机上「重新检测」悬浮在底部，拇指好按 */
  .rerun-btn { position: fixed; z-index: 99; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 14px 30px; font-size: 17px; }
  .rerun-btn:active { transform: translateX(-50%) scale(.96); }
  .hero { padding: 20px 18px 16px; }
  .hero-ip { font-size: 26px; }
  .ring { width: 66px; height: 66px; } .ring-in { width: 54px; height: 54px; } .hero-score { font-size: 20px; } .ring-cap { font-size: 9px; }
  .v-sentence { flex-basis: 100%; }
  .hero-meta { grid-template-columns: 1fr 1fr; }
  .section-title { flex-wrap: wrap; font-size: 20px; }
  .rg-grid { grid-template-columns: repeat(2, 1fr); }
  .rt-row { grid-template-columns: 1fr; gap: 6px; }
  .sum-grid { grid-template-columns: 1fr; }
  .ex-list { grid-template-columns: 1fr; }
  .ex-row:nth-child(2) { background-image: linear-gradient(var(--sep), var(--sep)); }
  .ex-name { min-width: 100px; }
  .kv-table td { padding: 8px 14px; }
  .kv-k { width: 38%; }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="topbar">
  <div>
    <h1 class="page-title">IP 体检</h1>
    <div class="page-sub">检测这台设备当前网络的出口 · 全部在本机浏览器里完成</div>
  </div>
  <button class="rerun-btn" id="rerun" type="button" disabled><span class="rr-icon">↻</span>重新检测</button>
</header>

<main id="report">
  <div class="progress"><div class="pg-title">正在检测</div></div>
</main>
<noscript><div class="fatal">需要开启 JavaScript 才能检测。</div></noscript>

<details class="settings" id="settings">
  <summary>设置</summary>
  <div class="settings-body">
    <div class="set-label">ipapi.is key（可选）</div>
    <div class="set-row">
      <input id="key-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="没有可以留空">
      <button class="btn btn-primary" id="key-save" type="button">保存</button>
    </div>
    <div class="set-hint" id="key-hint">填了以后多一个数据源参与判定，并能检测「爬虫 Bot」。key 只存在这台设备的浏览器里，不会上传到别处。免费 key 在 <a href="https://ipapi.is/" target="_blank" rel="noopener">ipapi.is</a> 注册后获取。</div>
    <div class="set-sep"></div>
    <label class="set-switch">震动反馈<input id="haptics-toggle" type="checkbox" switch></label>
    <div class="set-hint">点按钮、检测完成时轻震一下：干净震两下，有风险震三下。</div>
    <div class="set-sep"></div>
    <div class="set-label">本机数据</div>
    <div class="set-row">

// ───────── 网络请求 ─────────
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchText(url) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), TIMEOUT);
  try {
    const r = await fetch(url, { cache: "no-store", credentials: "omit", signal: ac.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.text();
  } catch (e) {
    if (e && e.name === "AbortError") throw new Error(`超过 ${TIMEOUT / 1000} 秒未返回`);
    if (e instanceof TypeError) throw new Error("连接失败（网络不通，或被浏览器 / 广告拦截拦下）");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function getJSON(url) {
  const text = await fetchText(url);
  try { return JSON.parse(text); } catch (e) { throw new Error("返回格式异常"); }
}

/** 有的数据源额度用尽、限流时仍返回 HTTP 200，只在 JSON 里带 error 字段；
 *  need 是判定必需的字段，缺了同样算失败，不能悄悄当成「查询成功但没有风险」。 */
function check(data, need) {
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("返回格式异常");
  const err = data.error;
  if (err) {
    const msg = typeof err === "object" ? (err.error_message || err.message) : err;
    throw new Error(String(msg || JSON.stringify(err)));
  }
  if (need && !isObj(data[need])) throw new Error(`返回里没有 ${need} 字段（可能被限流或改了免费政策）`);
  return data;
}

const isObj = v => !!v && typeof v === "object" && !Array.isArray(v) && !(v instanceof Error);

// ───────── 出口 IP ─────────
function parseTrace(body) {
  const m = /^ip=([0-9a-fA-F:.]+)\s*$/m.exec(body);
  return m ? m[1] : null;
}

// 手机上的代理 App 切换节点后，切换前建立的连接通常不会断，浏览器还会继续复用；
// 同一个域名再请求，走的仍是老节点，重新检测就拿到旧出口。所以每次检测都从一组域名里
// 挑本页还没连过的，强制新建连接。这些域名都在 Cloudflare 上，/cdn-cgi/trace 回显访问者 IP
// 且允许跨域读取；同一组的域名在分流规则里走同一条线路（cloudflare.com / openai.com、chatgpt.com /
// anthropic.com、claude.ai），换域名不会换线路。
const TRACE_POOLS = {
  default: ["www.cloudflare.com", "speed.cloudflare.com", "dash.cloudflare.com", "developers.cloudflare.com",
            "radar.cloudflare.com", "workers.cloudflare.com", "pages.cloudflare.com", "api.cloudflare.com",
            "support.cloudflare.com", "community.cloudflare.com", "one.dash.cloudflare.com", "cloudflare.com"],
  ChatGPT: ["chatgpt.com", "ab.chatgpt.com", "sora.chatgpt.com", "chat.openai.com", "openai.com",
            "www.openai.com", "api.openai.com", "platform.openai.com", "auth.openai.com"],
  Claude: ["claude.ai", "www.claude.ai", "api.anthropic.com", "console.anthropic.com", "www.anthropic.com",
           "docs.anthropic.com", "support.anthropic.com", "status.anthropic.com", "privacy.anthropic.com",
           "trust.anthropic.com", "assets.anthropic.com"],
};

// 本页连过的域名。连接池在刷新页面后还在，所以记在 sessionStorage；把网页从后台划掉才一起清空
const usedHosts = new Set((() => {
  try { return JSON.parse(sessionStorage.getItem("ipcheck.used_hosts") || "[]"); } catch (e) { return []; }
})());
function markUsed(host) {
  usedHosts.add(host);
  try { sessionStorage.setItem("ipcheck.used_hosts", JSON.stringify([...usedHosts])); } catch (e) { /* 只记在内存里 */ }
}

async function trace(host) {
  const ip = parseTrace(await fetchText(`https://${host}/cdn-cgi/trace`));
  if (!ip) throw new Error("返回里没有 IP");
  return ip;
}

/** 依次试一组域名里本页还没连过的（最多 3 个），返回 {ip, fresh}；
 *  新域名用完或都失败时退回第一个域名，fresh 为 false，表示可能沿用了切换节点前的连接。 */
async function traceFresh(pool) {
  let err;
  for (const host of pool.filter(h => !usedHosts.has(h)).slice(0, 3)) {
    markUsed(host);
    try { return { ip: await trace(host), fresh: true }; } catch (e) { err = e; }
  }
  try { return { ip: await trace(pool[0]), fresh: false }; } catch (e) { throw err || e; }
}

/** Cloudflare 整组都不通时，退回其他回显服务（这些会复用旧连接）。 */
async function detectEgress() {
  try { return await traceFresh(TRACE_POOLS.default); } catch (e) { /* 走下面的备用 */ }
  const echo = [
    ["https://ipinfo.io/json", t => JSON.parse(t).ip],
    ["https://api.ipify.org?format=json", t => JSON.parse(t).ip],
  ].map(([url, parse]) => fetchText(url).then(t => {
    const ip = String(parse(t) || "");
    if (!/^[\da-fA-F:.]+$/.test(ip)) throw new Error("不是 IP");
    return { ip, fresh: false };
  }));
  try { return await Promise.any(echo); } catch (e) { throw new Error("无法获取出口 IP，请检查网络"); }
}

// ───────── 分流出口：各服务实际看到的 IP ─────────
// 请求按手机上代理客户端的分流规则走各自线路，由服务方回显它看到的访问者 IP。
// YouTube 的 report_mapping 不允许网页跨域读取，浏览器里测不了。
const ROUTE_PROBES = [["ChatGPT", TRACE_POOLS.ChatGPT], ["Claude", TRACE_POOLS.Claude]];

// ───────── 数据源 ─────────
// proxycheck / ip2location / ip-api 不允许网页跨域读取（ip-api 免费版还只有 http），手机网页版用不了；
// 换成同样免 key、允许跨域的 freeipapi 补上「匿名标记」这一维
const SOURCES = [
  { key: "ipinfo", zh: "基础信息", link: "https://ipinfo.io/{ip}",
    fn: ip => getJSON(`https://ipinfo.io/${ip}/json`).then(d => { delete d.readme; return check(d); }) },
  { key: "iplocate", zh: "隐私标记", link: "https://iplocate.io/api/lookup/{ip}",
    fn: ip => getJSON(`https://iplocate.io/api/lookup/${ip}`).then(d => {
      check(d, "privacy");
      delete d.abuse; // 运营商的投诉联系方式，与判定无关
      return d;
    }) },
  { key: "ipquery", zh: "风险标记", link: "https://api.ipquery.io/{ip}?format=json",
    fn: ip => getJSON(`https://api.ipquery.io/${ip}?format=json`).then(d => check(d, "risk")) },
  { key: "freeipapi", zh: "代理标记", link: "https://free.freeipapi.com/api/json/{ip}",
    fn: ip => getJSON(`https://free.freeipapi.com/api/json/${ip}`).then(d => {
      check(d);
      if (typeof d.isProxy !== "boolean") throw new Error("返回里没有 isProxy 字段（可能被限流或改了免费政策）");
      delete d.timeZones; // 整个国家的时区列表，太长且与判定无关
      return d;
    }) },
  { key: "ipapi.is", zh: "综合风控", link: "https://api.ipapi.is/?q={ip}",
    fn: ip => {
      const q = new URLSearchParams({ q: ip });
      if (ipapiKey()) q.set("key", ipapiKey());
      return getJSON("https://api.ipapi.is/?" + q).then(d => { check(d); delete d.docs; return d; });
    } },
];
// 参与风险判定（投票或给风险分）的数据源；查询失败时在结论里注明
const RISK_SOURCES = ["iplocate", "ipquery", "freeipapi", "ipapi.is"];
/** 实际参与判定的数据源：ipapi.is 没有 key 时不返回风控字段，不算。 */
const voteSources = () => RISK_SOURCES.filter(k => k !== "ipapi.is" || ipapiKey());
const SOURCE_BY_KEY = Object.fromEntries(SOURCES.map(s => [s.key, s]));

// ───────── 结果缓存 ─────────
// 同一 IP 的数据库判定短时间内不会变，打开页面时复用结果以节省免费额度（iplocate 免 key 每天只有 50 次）；
// 手动点「重新检测」时 force 为 true，一律重新查
async function cachedFetch(key, ip, force) {
  const tag = key === "ipapi.is" && ipapiKey() ? `${key}+key` : key; // 配了 key 后不复用匿名结果
  const ck = `${tag}|${ip}`;
  const now = Date.now() / 1000;
  const hit = store.get("cache", {})[ck];
  if (!force && hit && isObj(hit.data) && now - hit.t >= 0 && now - hit.t < CACHE_TTL) {
    return { ...hit.data, _cache_age: Math.floor(now - hit.t) };
  }
  const data = await SOURCE_BY_KEY[key].fn(ip);
  const cache = Object.fromEntries(Object.entries(store.get("cache", {}))
    .filter(([, v]) => v && typeof v.t === "number" && now - v.t < CACHE_TTL));
  cache[ck] = { t: now, data };
  store.set("cache", cache);
  return data;
}

/** 获取默认出口 IP，并发查询全部数据源，同时探测各服务的分流出口。 */
async function runAll(log, force) {
  log("正在获取出口 IP（换新连接）");
  const { ip, fresh } = await detectEgress();
  log(`出口 IP：${ip}${fresh ? "" : "（可能沿用了旧连接）"}`, "ok");
  const results = {}, routes = {}, extra = {};
  const stale = fresh ? [] : ["默认线路"]; // 没能换新连接取出口的线路
  const todo = SOURCES;
  log(`正在并发查询 ${todo.length} 个数据源${force ? "（不用缓存）" : ""}，并检测 ${ROUTE_PROBES.length} 个服务的分流出口`);

  const jobs = todo.map(s => cachedFetch(s.key, ip, force).then(
    v => { results[s.key] = v; log(`✓ ${s.zh}（${s.key}）`, "ok"); },
    e => { results[s.key] = e; log(`× ${s.zh}（${s.key}）失败：${e.message}`, "bad"); }));
  for (const [name, pool] of ROUTE_PROBES) {
    jobs.push(traceFresh(pool).then(async ({ ip: rip, fresh: rf }) => {
      routes[name] = rip;
      if (!rf) stale.push(name);
      log(`✓ ${name} 看到的 IP：${rip}${rip === ip ? "（同默认线路）" : ""}`, "ok");
      if (rip === ip || rip in extra) return;
      extra[rip] = {};
      await Promise.all(voteSources().map(k => cachedFetch(k, rip, force).then(
        v => { extra[rip][k] = v; }, e => { extra[rip][k] = e; })));
    }, e => { routes[name] = e; log(`× ${name} 线路出口检测失败`, "bad"); }));
  }
  await Promise.race([Promise.allSettled(jobs), sleep(RUN_DEADLINE)]);

  // 到总时限还没返回的一律记为超时，不再等
  const late = () => new Error(`超过 ${RUN_DEADLINE / 1000} 秒未返回`);
  for (const s of todo) if (!(s.key in results)) results[s.key] = late();
  for (const [name] of ROUTE_PROBES) if (!(name in routes)) routes[name] = late();
  for (const rip of Object.keys(extra)) for (const k of voteSources()) if (!(k in extra[rip])) extra[rip][k] = late();
  return { ip, results, routes, extra, stale };
}

// ───────── 翻译 ─────────
function g(d, ...keys) {
  let cur = d;
  for (const k of keys) {
    if (!isObj(cur) || !(k in cur)) return null;
    cur = cur[k];
  }
  return cur === null || cur === undefined || cur === "" ? null : cur;
}

/** 统一各数据源的布尔表达：true/false 或 "yes"/"no"，其他视为没表态。 */
function yn(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "string" && ["yes", "no"].includes(v.toLowerCase())) return v.toLowerCase() === "yes";
  return null;
}

function zhValue(k, v) {
  if (v === null || v === undefined || v === "") return "—";
  if (typeof v === "boolean") return v ? "是" : "否";
  if (typeof v === "object") return JSON.stringify(v);
  const sv = String(v).trim();
  if (!sv) return "—";
  const low = sv.toLowerCase();
  if (low === "yes" || low === "no") return low === "yes" ? "是" : "否";
  if (["country", "country_code", "countryCode", "isocode"].includes(k) && /^[A-Za-z]{2}$/.test(sv)) {
    return `${COUNTRY_ZH[sv.toUpperCase()] || sv} (${sv.toUpperCase()})`;
  }
  if (k === "country_name") return sv.length === 2 ? (COUNTRY_ZH[sv.toUpperCase()] || sv) : sv;
  if (["continent", "continent_code", "continentcode", "continentCode"].includes(k) && sv.length === 2) {
    return CONTINENT_ZH[sv.toUpperCase()] || sv;
  }
  if (k === "risk" || k === "risk_score") return /^\d+$/.test(sv) ? `${sv} / 100` : (RISK_LEVEL_ZH[low] || sv);
  if (k === "type") return NET_TYPE_ZH[low] || sv;
  if (k === "usage_type") return USAGE_TYPE_ZH[sv.toUpperCase()] || sv;
  if (k === "fraud_score") return `${sv} / 100`;
  return sv;
}

// ───────── 综合判定（多源交叉验证）─────────
/** {数据源: 结果}，失败或缺失的数据源给空对象，缓存标记 _cache_age 剥掉。 */
function sourceDicts(results) {
  const out = {};
  for (const s of SOURCES) {
    const v = results[s.key];
    out[s.key] = isObj(v) ? Object.fromEntries(Object.entries(v).filter(([k]) => !k.startsWith("_"))) : {};
  }
  return out;
}

/** 把各数据源的判断汇总到每个维度：{维度: [[数据源, true/false], ...]}，没表态的源不计入。
 *  「代理 IP」只收严格口径（明确是代理）；freeipapi 的 isProxy、iplocate 的 is_anonymous
 *  是宽口径（代理、VPN、Tor 任一），归入「匿名标记」。 */
function collectEvidence(src) {
  const ipapi = src["ipapi.is"], fip = src.freeipapi;
  const priv = g(src.iplocate, "privacy") || {}, risk = g(src.ipquery, "risk") || {};
  const votes = {
    vpn: [["ipapi.is", yn(g(ipapi, "is_vpn"))], ["iplocate", yn(g(priv, "is_vpn"))], ["ipquery", yn(g(risk, "is_vpn"))]],
    proxy: [["ipapi.is", yn(g(ipapi, "is_proxy"))], ["iplocate", yn(g(priv, "is_proxy"))], ["ipquery", yn(g(risk, "is_proxy"))]],
    anon: [["freeipapi", yn(g(fip, "isProxy"))], ["iplocate", yn(g(priv, "is_anonymous"))]],
    datacenter: [["ipapi.is", yn(g(ipapi, "is_datacenter"))], ["iplocate", yn(g(priv, "is_hosting"))],
                 ["ipquery", yn(g(risk, "is_datacenter"))]],
    tor: [["ipapi.is", yn(g(ipapi, "is_tor"))], ["iplocate", yn(g(priv, "is_tor"))], ["ipquery", yn(g(risk, "is_tor"))]],
    abuser: [["ipapi.is", yn(g(ipapi, "is_abuser"))], ["iplocate", yn(g(priv, "is_abuser"))]],
    crawler: [["ipapi.is", yn(g(ipapi, "is_crawler"))]],
    mobile: [["ipapi.is", yn(g(ipapi, "is_mobile"))], ["ipquery", yn(g(risk, "is_mobile"))]],
  };
  return Object.fromEntries(Object.entries(votes).map(([k, vs]) => [k, vs.filter(([, v]) => v !== null)]));
}

/** 返回 [0-100 风险分, 来源]。 */
function riskScore(src) {
  const s = String(g(src.ipquery, "risk", "risk_score") ?? "");
  return /^\d+$/.test(s) && +s <= 100 ? [+s, "ipquery"] : [null, null];
}

const tally = votes => [votes.filter(([, v]) => v).length, votes.length];

/** 维度结论：unknown 无数据 / no 全部为否 / yes 过半为是 / doubt 意见不一（含打平）。 */
function dimState(votes) {
  const [yes, n] = tally(votes);
  if (n === 0) return "unknown";
  if (yes === 0) return "no";
  return yes * 2 > n ? "yes" : "doubt";
}

const scoreCls = (score, prefix) =>
  score === null ? `${prefix}-unk` : `${prefix}-${score >= 67 ? "bad" : score >= 34 ? "warn" : "ok"}`;

/** failed 为查询失败的风控数据源名。 */
function computeVerdict(ev, score, failed) {
  // 核心维度（VPN / 匿名标记 / 数据中心）至少两个有数据源表态，或者有风险分，才下结论
  if (["vpn", "anon", "datacenter"].filter(k => ev[k].length).length < 2 && score === null) {
    const why = failed.length ? `${failed.join("、")} 查询失败，` : "";
    return { level: "数据不足", sentence: `${why}风控数据不足，无法判定，请稍后重新检测`, color: "v-unk", hit: [], score: null };
  }
  const states = Object.fromEntries(Object.entries(ev).map(([k, v]) => [k, dimState(v)]));
  const critical = DIMENSIONS.some(([k, , s]) => s === "critical" && states[k] === "yes");
  const tie = k => { const [yes, n] = tally(ev[k]); return n > 0 && yes * 2 === n; };
  // 严重项只要有源说是、一般风险项打平（一半源说是），都至少算中等风险；
  // 一般风险项只有少数源说是，才维持「较为干净」并标注存疑
  const risky = DIMENSIONS.some(([k, , s]) => s === "risk" && (states[k] === "yes" || tie(k)))
    || DIMENSIONS.some(([k, , s]) => s === "critical" && states[k] === "doubt");
  const hit = DIMENSIONS.filter(([k, , s]) => states[k] === "yes" && s !== "info").map(([, zh]) => zh);
  const doubt = DIMENSIONS.filter(([k, , s]) => states[k] === "doubt" && s !== "info")
    .map(([k, zh]) => { const [yes, n] = tally(ev[k]); return `${zh}（${yes}/${n} 源）`; });

  let level, color;
  if (critical || (score !== null && score >= 67)) [level, color] = ["高风险", "v-bad"];
  else if (risky || (score !== null && score >= 34)) [level, color] = ["中等风险", "v-warn"];
  else [level, color] = ["较为干净", "v-ok"];

  const doubtText = doubt.length ? "存疑：" + doubt.join("、") + "，数据源意见不一" : "";
  let sentence;
  if (hit.length) sentence = "检测到：" + hit.join("、") + (doubt.length ? `；${doubtText}` : "");
  else if (score !== null && score >= 34) sentence = "风险评分偏高，建议进一步排查" + (doubt.length ? `；${doubtText}` : "");
  else if (doubt.length) sentence = doubtText;
  else if (states.mobile === "yes") sentence = "未发现风险标志（移动网络出口）";
  else sentence = "未触发明显风险标志";
  if (failed.length) sentence += `；${failed.join("、")} 查询失败，结论基于其余数据源`;
  return { level, sentence, color, hit, score };
}

/** 对一组数据源结果给出完整判定。 */
function assess(results) {
  const src = sourceDicts(results);
  const ev = collectEvidence(src);
  const [score, scoreSrc] = riskScore(src);
  const voters = voteSources().filter(k => k in results);
  const failed = voters.filter(k => !isObj(results[k]));
  const ok = voters.filter(k => isObj(results[k])).sort();
  return { src, ev, score, scoreSrc, verdict: computeVerdict(ev, score, failed), ok };
}

// ───────── 历史对比 ─────────
function loadHistory() {
  const h = store.get("history", []);
  return Array.isArray(h) ? h.filter(isObj) : [];
}
const isReliable = h => !(h.unreliable || h.level === "数据不足");

/** 对比上一次可靠的检测记录，判断这次变化是「节点换了出口 IP」还是「IP 没变、数据库重新分类了」。
 *  dcNow：本次数据中心维度的结论（true/false，意见不一或无数据为 null）；
 *  sources：本次成功参与判定的数据源。两次成功的数据源不同时判定依据不同，不能直接比较。 */
function diagnoseChange(history, ip, verdict, dcNow, sources) {
  const level = verdict.level;
  if (level === "数据不足") return { changed: false, skipped: true, reason: "本次风控数据不足，不与历史对比，也不写入历史记录。" };
  const prev = [...history].reverse().find(isReliable);
  if (!prev) return null;
  if (Array.isArray(prev.sources) && [...prev.sources].sort().join() !== [...sources].sort().join()) {
    const gone = prev.sources.filter(s => !sources.includes(s)).sort();
    const added = sources.filter(s => !prev.sources.includes(s)).sort();
    const diff = [gone.length ? `少了 ${gone.join("、")}` : "", added.length ? `多了 ${added.join("、")}` : ""].filter(Boolean).join("；");
    return { changed: false, skipped: true, reason: `本次成功的数据源和上次（${prev.time || "—"}）不同（${diff}），判定依据不一样，暂不对比。` };
  }
  const levelChanged = prev.level !== level;
  const dcChanged = typeof prev.is_datacenter === "boolean" && dcNow !== null && prev.is_datacenter !== dcNow;
  if (!levelChanged && !dcChanged) return { changed: false, prev_time: prev.time, prev_ip: prev.ip, cur_ip: ip, same_ip: prev.ip === ip };

  const prevRank = LEVEL_RANK[prev.level] ?? 0, curRank = LEVEL_RANK[level] ?? 0;
  let badge, title, text;
  if (prev.ip !== ip) {
    // 手机上切节点很常见，不能默认当成节点自己漂移
    badge = "info";
    title = "出口 IP 换了，不是数据库的问题";
    text = `上次检测出口 IP 是 ${prev.ip || "—"}，这次是 ${ip}。如果你刚手动切换过节点，这是正常的，结论以本次为准。`
      + "如果没切换过，说明节点自己换了后端服务器，常见原因是客户端里用的是「自动测速 / 策略组」，"
      + "或者订阅把住宅 IP 和机房 IP 混在一起分配；想固定出口，就选定单一节点，不用自动选优。";
  } else {
    badge = curRank > prevRank ? "bad" : curRank < prevRank ? "ok" : "info";
    title = "出口 IP 没变，是风控数据库重新分类了";
    const yesNo = b => (b ? "是" : "否");
    const what = levelChanged ? `判定从「${prev.level || "—"}」改成了「${level}」`
      : `「数据中心」一项从「${yesNo(prev.is_datacenter)}」变成了「${yesNo(dcNow)}」（总体等级没变）`;
    text = `出口 IP 仍是 ${ip}，用的数据源也和上次一样，但${what}——这是数据库自己定期重新扫描 IP 段导致的，与你的网络设置无关，`
      + "无法通过换节点解决，只能等它下次再更新，或换一个 IP 段本身更干净的节点。";
  }
  return { changed: true, badge, title, text, prev_time: prev.time, prev_level: prev.level, cur_level: level };
}

// ───────── HTML 片段 ─────────
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = n => String(n).padStart(2, "0");
const fmtTime = (d, sec) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
  + (sec ? `:${pad(d.getSeconds())}` : "");
const MARK = { "较为干净": "✓", "中等风险": "⚠", "高风险": "✗" };

function renderDiagnosis(diag) {
  if (diag === null) {
    return '<div class="diag-box diag-info"><div class="diag-title">已建立检测基线</div>'
      + '<div class="diag-body">这是这台设备上的第一次记录，后续再检测时会自动对比，判断评分变化究竟是「节点换了 IP」还是「数据库重新分类」。</div></div>';
  }
  if (diag.skipped) return `<div class="diag-box diag-info"><div class="diag-body">${esc(diag.reason)}</div></div>`;
  if (!diag.changed) {
    const when = esc(diag.prev_time || "—");
    if (!diag.same_ip) {
      return `<div class="diag-box diag-info"><div class="diag-body">与上次检测（${when}）相比，出口 IP 从 ${esc(diag.prev_ip || "—")} `
        + `换成了 ${esc(diag.cur_ip)}，判定结果一致。</div></div>`;
    }
    return `<div class="diag-box diag-info"><div class="diag-body">与上次检测（${when}）相比，出口 IP 和判定结果都没变。</div>`
      + '<div class="diag-meta">如果你刚切换过节点：同一订阅的多个节点常常共用同一个出口，结果不变是正常的。'
      + "想确认，换一个不同地区或机房的节点再测。</div></div>";
  }
  return `<div class="diag-box diag-${diag.badge}"><div class="diag-title">${esc(diag.title)}</div>`
    + `<div class="diag-body">${esc(diag.text)}</div>`
    + `<div class="diag-meta">上次检测：${esc(diag.prev_time || "—")}（${esc(diag.prev_level || "—")}） → 本次：${esc(diag.cur_level)}</div></div>`;
}

/** 返回 [ASN 号如 "AS7018", 运营方名称]。兼容 ipapi.is 带 key 的对象格式和匿名的字符串格式。 */
function asnInfo(src) {
  const ipapi = src["ipapi.is"];
  const num = g(ipapi, "asn", "asn");
  if (num) return [`AS${num}`, g(ipapi, "asn", "org") || "—"];
  for (const s of [g(ipapi, "asn"), g(src.ipinfo, "org")]) {
    const m = typeof s === "string" ? /^(AS\d+)\s*(.*)$/.exec(s) : null;
    if (m) return [m[1], m[2] || "—"];
  }
  for (const [n, org] of [[g(src.iplocate, "asn", "asn"), g(src.iplocate, "asn", "name")],
                          [g(src.ipquery, "isp", "asn"), g(src.ipquery, "isp", "org")],
                          [g(src.freeipapi, "asn"), g(src.freeipapi, "asnOrganization")]]) {
    if (n) return [/^\d+$/.test(String(n)) ? `AS${n}` : String(n), org || "—"];
  }
  return ["—", "—"];
}

/** iplocate 的公司类型优先，其次 ipapi.is（带 key 时）的公司 / ASN 类型。 */
function netTypeZh(src) {
  for (const t of [g(src.iplocate, "company", "type"), g(src.iplocate, "asn", "type"),
                   g(src["ipapi.is"], "company", "type"), g(src["ipapi.is"], "asn", "type")]) {
    if (t) return NET_TYPE_ZH[String(t).toLowerCase()] || String(t);
  }
  return "—";
}

/** 「国家 · 地区 · 城市」，取第一个有数据的源。 */
function place(src) {
  for (const [cc, region, city] of [
    [g(src.ipinfo, "country"), g(src.ipinfo, "region"), g(src.ipinfo, "city")],
    [g(src.iplocate, "country_code"), g(src.iplocate, "subdivision"), g(src.iplocate, "city")],
    [g(src.ipquery, "location", "country_code"), g(src.ipquery, "location", "state"), g(src.ipquery, "location", "city")],
    [g(src.freeipapi, "countryCode"), g(src.freeipapi, "regionName"), g(src.freeipapi, "cityName")],
  ]) {
    if (typeof cc === "string" && cc) {
      const parts = [COUNTRY_ZH[cc.toUpperCase()] || cc, region, city]
        .filter(p => (typeof p === "string" || typeof p === "number") && p !== "").map(String);
      return [...new Set(parts)].join(" · "); // 去掉重复的地区名（如 香港 · Hong Kong · Hong Kong）
    }
  }
  return "—";
}

function renderHero(ip, a, when, runNo, stale) {
  const { src, verdict: v, scoreSrc } = a;
  const [asn, org] = asnInfo(src);
  const asnStr = asn !== "—" ? `${asn} · ${org}` : org;
  const relay = yn(g(src.iplocate, "privacy", "is_icloud_relay"))
    ? '<div class="relay">这是 iCloud 专用代理（Private Relay）的 IP，不是你代理节点的出口。想测节点，请在「设置 › 顶部你的名字 › iCloud › 专用代理」里暂时关掉，或换个浏览器打开本页。</div>'
    : "";
  const staleNote = stale.length
    ? `<div class="relay">${esc(stale.join("、"))}这次没能换新连接（本页能用的新域名用完了）。如果你刚切换过节点，结果可能还是切换前的；把本页从后台划掉、重新打开再测。</div>`
    : "";
  return `<section class="hero">
  <div class="hero-top">
    <div class="hero-ip-block"><div class="hero-label">当前出口 IP</div><div class="hero-ip">${esc(ip)}</div></div>
    <div class="hero-score-block">
      <div class="ring ${scoreCls(v.score, "v")}" style="--p:${v.score ?? 0}"><div class="ring-in">
        <div class="hero-score ${scoreCls(v.score, "v")}">${v.score !== null ? v.score : "—"}</div><div class="ring-cap">风险分</div>
      </div></div>
      <div class="hero-score-label">${scoreSrc ? esc(scoreSrc) : "暂无评分"}</div>
    </div>
  </div>
  <div class="hero-verdict ${v.color}">
    <span class="v-mark">${MARK[v.level] || "?"}</span><span class="v-level">${esc(v.level)}</span>
    <span class="v-sep">·</span><span class="v-sentence">${esc(v.sentence)}</span>
  </div>
  ${relay}${staleNote}
  <div class="hero-meta">
    <div class="hm-item"><div class="hm-k">位置</div><div class="hm-v">${esc(place(src))}</div></div>
    <div class="hm-item"><div class="hm-k">服务商</div><div class="hm-v">${esc(asnStr)}</div></div>
    <div class="hm-item"><div class="hm-k">网络类型</div><div class="hm-v">${esc(netTypeZh(src))}</div></div>
    <div class="hm-item"><div class="hm-k">检测时间</div><div class="hm-v">${esc(when)}<div class="rt-sub">本页第 ${runNo} 次检测</div></div></div>
  </div>
</section>`;
}

function renderRiskGrid(a) {
  const { ev, score, scoreSrc, src } = a;
  const cells = DIMENSIONS.map(([key, label, sev]) => {
    const votes = ev[key] || [];
    const st = dimState(votes);
    const [yes, n] = tally(votes);
    let tag, cls, hint;
    if (st === "unknown") {
      [tag, cls] = ["未知", "rg-unk"];
      hint = KEY_ONLY_DIMS.has(key) && !ipapiKey() ? "需在下方「设置」填 ipapi.is key" : "无数据";
    } else if (st === "no") {
      [tag, cls, hint] = ["否", "rg-ok", n > 1 ? `${n} 源一致` : "1 源"];
    } else if (st === "yes") {
      [tag, cls, hint] = ["是", sev === "info" ? "rg-info" : "rg-bad", `${yes}/${n} 源判定`];
    } else {
      [tag, cls, hint] = ["存疑", sev === "info" ? "rg-info" : "rg-warn", `${yes}/${n} 源认为是`];
    }
    const detail = votes.map(([s, v]) => `${s}：${v ? "是" : "否"}`).join(" / ");
    return `<div class="rg-cell"><div class="rg-label">${esc(label)}</div><div class="rg-value ${cls}">${tag}</div>`
      + `<div class="rg-hint">${esc(hint)}</div>${detail && st !== "no" ? `<div class="rg-votes">${esc(detail)}</div>` : ""}</div>`;
  });
  cells.push(`<div class="rg-cell rg-cell-wide"><div class="rg-label">风险评分${scoreSrc ? `（${esc(scoreSrc)}）` : ""}</div>`
    + `<div class="rg-value ${scoreCls(score, "rg")}">${score !== null ? `${score} / 100` : "—"}</div>`
    + '<div class="rg-hint">0-33 低 · 34-66 中 · 67-100 高</div></div>');
  cells.push('<div class="rg-cell rg-cell-wide"><div class="rg-label">网络类型</div>'
    + `<div class="rg-value rg-info">${esc(netTypeZh(src))}</div>`
    + '<div class="rg-hint">住宅宽带 / 移动网络最干净，机房托管最容易被风控</div></div>');
  return `<div class="rg-grid">${cells.join("")}</div>`;
}

function renderRoutes(ip, main, routes, extra) {
  const detail = src => {
    const [asn, org] = asnInfo(src);
    return [place(src), `${asn} ${org}`.replace(/^[\s—]+|[\s—]+$/g, ""), netTypeZh(src)].filter(p => p && p !== "—").join(" · ");
  };
  const row = (name, sub, rip, det, v, note) =>
    `<div class="rt-row"><div class="rt-name">${esc(name)}<div class="rt-sub">${esc(sub)}</div></div>`
    + `<div class="rt-ip">${esc(rip)}<div class="rt-sub">${esc(det)}</div></div>`
    + `<div class="rt-verdict ${v.color}"><b>${MARK[v.level] || "?"} ${esc(v.level)}</b><div class="rt-sub">${esc(note || v.sentence)}</div></div></div>`;

  const rows = [row("默认线路", "其他网站", ip, detail(main.src), main.verdict)];
  const worse = [];
  for (const [name] of ROUTE_PROBES) {
    const r = routes[name];
    if (r === undefined) continue;
    if (r instanceof Error) {
      rows.push(row(name, "—", "—", "检测失败（该服务可能不可达）", { level: "未知", color: "v-unk" }, "未能从该服务取得出口 IP"));
      continue;
    }
    if (r === ip) {
      rows.push(row(name, "分流规则", r, "与默认线路相同", main.verdict, "与默认线路是同一个出口"));
      continue;
    }
    const a = assess(extra[r] || {});
    rows.push(row(name, "分流规则", r, detail(a.src), a.verdict));
    // 只在两边都有明确等级时比较；默认线路「数据不足」时不能说别的线路「更差」
    if (a.verdict.level in LEVEL_RANK && main.verdict.level in LEVEL_RANK
        && LEVEL_RANK[a.verdict.level] > LEVEL_RANK[main.verdict.level]) worse.push(`${name} ${a.verdict.level}`);
  }
  const hint = worse.length ? "注意：" + worse.join("、") : "各服务实际看到的 IP";
  const note = '<div class="rt-note">YouTube 不允许网页读取它的线路诊断页，手机网页版测不了它的分流出口。</div>';
  return [`<div class="rt-list">${rows.join("")}</div>${note}`, hint];
}

function renderSummary(ip, a) {
  const { src, verdict: v } = a;
  const loc = place(src).split(" · ");
  const [asn, asnOrg] = asnInfo(src);
  const cols = [
    ["基本信息", [["出口 IP", ip], ["国家", loc[0] || "—"], ["城市", loc.length > 1 ? loc[loc.length - 1] : "—"]]],
    ["网络归属", [["ASN", asn], ["服务商", asnOrg], ["网络类型", netTypeZh(src)]]],
    ["综合判定", [["等级", v.level], ["风险评分", v.score !== null ? `${v.score} / 100` : "—"], ["命中项", v.hit.length ? v.hit.join("、") : "无"]]],
  ];
  return '<div class="sum-grid">' + cols.map(([title, rows]) =>
    `<div class="sum-col"><div class="sum-title">${esc(title)}</div>`
    + rows.map(([k, val]) => `<div class="sum-row"><div class="sum-k">${esc(k)}</div><div class="sum-v">${esc(val)}</div></div>`).join("")
    + "</div>").join("") + "</div>";
}

/** 递归把对象渲染成中文 key-value 表。 */
function renderDictTable(d) {
  const rows = [];
  for (const [k, v] of Object.entries(d)) {
    if (k.startsWith("_")) continue; // 内部标记（如缓存时间），不展示
    const label = esc(KEY_ZH[k] || k);
    if (isObj(v)) {
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v kv-nested">${renderDictTable(v)}</td></tr>`);
    } else if (Array.isArray(v)) {
      const items = v.map(it => `<li>${esc(typeof it === "object" ? JSON.stringify(it) : it)}</li>`).join("");
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v">${v.length ? `<ul class="kv-list">${items}</ul>` : "—"}</td></tr>`);
    } else {
      // 风险类字段：是 红，否 绿；其他字段不上色
      const flag = yn(v);
      const cls = flag !== null && RISK_FIELDS.has(k) ? (flag ? " kv-bad" : " kv-ok") : "";
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v${cls}">${esc(zhValue(k, v))}</td></tr>`);
    }
  }
  return `<table class="kv-table">${rows.join("")}</table>`;
}

function renderSourceCard(s, ip, result) {
  let sub = `来源：${s.key}`;
  if (s.key === "ipapi.is" && !ipapiKey()) sub += "（未配置 key，只有归属信息）";
  if (isObj(result) && "_cache_age" in result) sub += ` · 缓存结果（${Math.max(1, Math.floor(result._cache_age / 60))} 分钟前）`;
  const link = s.link.replace("{ip}", encodeURIComponent(ip));
  const body = result instanceof Error ? `<div class="src-err">获取失败：${esc(result.message)}</div>`
    : isObj(result) ? renderDictTable(result) : '<div class="src-err">未查询</div>';
  return `<div class="src-card"><div class="src-head"><div class="src-title">${esc(s.zh)}</div><div class="src-sub">${esc(sub)}</div>`
    + `<a class="src-link" href="${esc(link)}" target="_blank" rel="noopener">查看原始页面 ↗</a></div>${body}</div>`;
}

function renderExternal(ip) {
  return '<div class="ex-list">' + ANTIBOT_SITES.map(([name, tpl, desc]) =>
    `<a class="ex-row" href="${esc(tpl.replace("{ip}", encodeURIComponent(ip)))}" target="_blank" rel="noopener">`
    + `<div class="ex-name">${esc(name)}</div><div class="ex-desc">${esc(desc)}</div><div class="ex-arrow">›</div></a>`).join("") + "</div>";
}

function plain(obj) {
  if (obj instanceof Error) return `Error: ${obj.message}`;
  if (Array.isArray(obj)) return obj.map(plain);
  if (obj && typeof obj === "object") return Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, plain(v)]));
  return obj;
}

function buildReport(run, runNo) {
  const { ip, results, routes, extra, stale } = run;
  const now = new Date();
  const main = assess(results);
  document.body.dataset.tone = main.verdict.color.slice(2); // 背景色块跟着结论变色
  const asBool = { yes: true, no: false }; // 意见不一或无数据记为 null，不能记成「否」
  const dcNow = asBool[dimState(main.ev.datacenter)] ?? null;

  const history = loadHistory();
  const diag = diagnoseChange(history, ip, main.verdict, dcNow, main.ok);
  if (main.verdict.level !== "数据不足") {
    history.push({
      time: fmtTime(now, true), ip, level: main.verdict.level, is_datacenter: dcNow,
      is_vpn: asBool[dimState(main.ev.vpn)] ?? null, risk_score: main.score, sources: main.ok,
    });
    store.set("history", history.slice(-HISTORY_MAX));
  }

  const [routesHtml, routesHint] = renderRoutes(ip, main, routes, extra);
  const cards = SOURCES.map(s => renderSourceCard(s, ip, results[s.key])).join("");
  const raw = JSON.stringify({ 默认出口: plain(results), 分流出口: plain(routes), 分流出口数据: plain(extra) }, null, 2);
  const title = (t, hint) => `<div class="section-title">${t}${hint ? ` <span class="st-hint">${esc(hint)}</span>` : ""}</div>`;

  return renderHero(ip, main, fmtTime(now, true), runNo, stale)
    + title("分流出口", routesHint) + routesHtml
    + title("历史对比", "自动判断变化原因") + renderDiagnosis(diag)
    + title("风险检测一览", "红色 = 命中风险 / 绿色 = 正常") + renderRiskGrid(main)
    + title("综合摘要") + renderSummary(ip, main)
    + title("数据源详情", "字段名已翻译为中文") + cards
    + title("外部检测网站", "点击条目在浏览器中打开") + renderExternal(ip)
    + `<details><summary>展开查看原始 JSON 数据</summary><pre>${esc(raw)}</pre></details>`;
}

// ───────── 页面控制 ─────────
const $ = id => document.getElementById(id);
let running = false;
let runCount = 0;

/** force：手动点「重新检测」时为 true，数据源一律重新查，不用缓存。 */
async function start(force) {
  if (running) return;
  running = true;
  runCount += 1;
  $("rerun").disabled = true;
  $("report").innerHTML = `<div class="progress"><div class="pg-title">正在第 ${runCount} 次检测</div><ul class="pg-log" id="pg-log"></ul></div>`;
  window.scrollTo(0, 0);
  const log = (text, cls) => {
    const li = document.createElement("li");
    li.textContent = text;
    if (cls) li.className = cls;
    $("pg-log").appendChild(li);
  };
  try {
    const run = await runAll(log, force);
    $("report").innerHTML = buildReport(run, runCount);
    document.title = `IP 体检 · ${run.ip}`;
    if (force) haptic({ ok: "success", warn: "warn", bad: "error" }[document.body.dataset.tone] || "warn");
  } catch (e) {
    $("report").innerHTML = `<div class="fatal">检测失败：${esc(e.message)}<div class="diag-body">`
      + "检查一下手机网络或代理是否正常，然后点「重新检测」。</div></div>";
    if (force) haptic("error");
  } finally {
    running = false;
    $("rerun").disabled = false;
    refreshSettings();
  }
}

// ───────── 震动反馈 ─────────
// 安卓用 navigator.vibrate；iPhone 的 Safari 不支持它，但点一下系统开关控件（<input switch>）
// 会带原生触感，借这个来震。不支持的设备上什么也不发生。
const hapticsOn = () => store.get("haptics", true) !== false;
const HAPTIC = { tap: [8], success: [10, 70, 10], warn: [12, 70, 12, 70, 12], error: [30, 80, 30] };

function iosTick() {
  try {
    const label = document.createElement("label");
    label.setAttribute("aria-hidden", "true");
    label.style.display = "none";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.setAttribute("switch", "");
    label.appendChild(input);
    document.head.appendChild(label);
    label.click();
    label.remove();
  } catch (e) { /* 不支持就算了 */ }
}

function haptic(kind) {
  if (!hapticsOn()) return;
  const pattern = HAPTIC[kind] || HAPTIC.tap;
  try {
    if (typeof navigator.vibrate === "function" && navigator.vibrate(pattern)) return;
  } catch (e) { /* 走下面的 iOS 办法 */ }
  // iOS 每次只能轻触一下，按图案里「震」的段数连点几下
  for (let i = 0; i < Math.ceil(pattern.length / 2); i++) setTimeout(iosTick, i * 110);
}

function refreshSettings() {
  $("key-input").value = ipapiKey();
  $("haptics-toggle").checked = hapticsOn();
  $("clear-history").textContent = `清除历史记录（${loadHistory().length} 条）`;
}

$("rerun").addEventListener("click", () => { haptic("tap"); start(true); });
$("haptics-toggle").addEventListener("change", e => {
  store.set("haptics", e.target.checked);
  haptic("tap"); // 开关本身在 iPhone 上就会震，安卓补一下
});
// 展开折叠、打开外部网站、查看原始页面时轻震
document.addEventListener("click", e => { if (e.target.closest("summary, .ex-row, .src-link")) haptic("tap"); });
$("key-save").addEventListener("click", () => {
  haptic("tap");
  const k = $("key-input").value.trim();
  if (k) store.set("ipapi_key", k); else store.del("ipapi_key");
  $("key-hint").textContent = k ? "已保存。下次检测起 ipapi.is 参与判定（数据源变了，第一次不做历史对比）。"
    : "已清除 key，ipapi.is 不再参与判定。";
  refreshSettings();
});
$("clear-history").addEventListener("click", () => {
  haptic("tap");
  if (confirm("清除这台设备上的全部检测历史？")) { store.del("history"); refreshSettings(); haptic("success"); }
});
$("clear-cache").addEventListener("click", () => { store.del("cache"); $("clear-cache").textContent = "缓存已清除"; haptic("success"); });

// 测试入口（不影响页面）
window.__ipcheck = { assess, computeVerdict, collectEvidence, diagnoseChange, dimState, place, asnInfo, netTypeZh };

refreshSettings();
start(false);
</script>
