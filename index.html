    throw new Error(String(msg || JSON.stringify(err)));
  }
  if (need && !isObj(data[need])) throw new Error(`返回里没有 ${need} 字段（可能被限流或改了免费政策）`);
  return data;
}

const isObj = v => !!v && typeof v === "object" && !Array.isArray(v) && !(v instanceof Error);

// ───────── 出口 IP ─────────
function parseTrace(body) {
  const m = /^ip=([0-9a-fA-F:.]+)\s*$/m.exec(body);
  return m ? m[1] : null;
}

/** 整段是不是一个 IP（纯文本回显末尾可能带换行）。 */
function validIp(s) {
  const v = String(s ?? "").trim();
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(v) && v.split(".").every(n => +n <= 255)) return v;
  if (/^[0-9a-fA-F:.]+$/.test(v) && v.includes(":") && v.length <= 45) return v;
  return null;
}

// 三种回显格式：Cloudflare /cdn-cgi/trace 的 ip= 行、纯文本 IP、JSON 里的 ip 字段
const PARSE = {
  trace: parseTrace,
  plain: validIp,
  "json-ip": t => { try { const d = JSON.parse(t); return isObj(d) ? validIp(d.ip) : null; } catch (e) { return null; } },
};

// 手机上的代理 App 切换节点后，切换前建立的连接通常不会断，浏览器还会继续复用；
// 同一个域名再请求，走的仍是老节点，重新检测就拿到旧出口。所以每次检测都从一组域名里
// 挑本页还没连过的，强制新建连接。这些域名都在 Cloudflare 上，/cdn-cgi/trace 回显访问者 IP
// 且允许跨域读取；同一组的域名在分流规则里走同一条线路（cloudflare.com → 🌍；openai.com、chatgpt.com → 💬 ChatGPT；
// anthropic.com、claude.ai → 🤖 AI 专用），换域名不会换线路。
const TRACE_POOLS = {
  // speed.cloudflare.com 是其他外网线路的测速域名（同样落到兜底 🌍），留给测速自己建连接，不放在这里
  default: ["www.cloudflare.com", "dash.cloudflare.com", "developers.cloudflare.com",
            "radar.cloudflare.com", "workers.cloudflare.com", "pages.cloudflare.com", "api.cloudflare.com",
            "support.cloudflare.com", "community.cloudflare.com", "one.dash.cloudflare.com", "cloudflare.com"],
  ChatGPT: ["chatgpt.com", "ab.chatgpt.com", "sora.chatgpt.com", "chat.openai.com", "openai.com",
            "www.openai.com", "api.openai.com", "platform.openai.com", "auth.openai.com"],
  Claude: ["claude.ai", "www.claude.ai", "api.anthropic.com", "console.anthropic.com", "www.anthropic.com",
           "docs.anthropic.com", "support.anthropic.com", "status.anthropic.com", "privacy.anthropic.com",
           "trust.anthropic.com", "assets.anthropic.com"],
};

// 本页连过的域名。连接池在刷新页面后还在，所以记在 sessionStorage；把网页从后台划掉才一起清空
const usedHosts = new Set((() => {
  try { return JSON.parse(sessionStorage.getItem("ipcheck.used_hosts") || "[]"); } catch (e) { return []; }
})());
function markUsed(host) {
  usedHosts.add(host);
  try { sessionStorage.setItem("ipcheck.used_hosts", JSON.stringify([...usedHosts])); } catch (e) { /* 只记在内存里 */ }
}

const hostOf = url => new URL(url).host;
const tracePool = hosts => hosts.map(h => [h, `https://${h}/cdn-cgi/trace`, "trace"]);

async function echoOnce([, url, kind]) {
  const ip = PARSE[kind](await fetchText(url));
  if (!ip) throw new Error("返回里没有 IP");
  return ip;
}

/** 依次试一组回显地址里本页还没连过的域名（最多 3 个），返回 {ip, fresh, host}；
 *  新域名用完或都失败时退回第一个，fresh 为 false，表示可能沿用了切换节点前的连接。 */
async function echoFresh(pool) {
  let err;
  for (const e of pool.filter(e => !usedHosts.has(hostOf(e[1]))).slice(0, 3)) {
    markUsed(hostOf(e[1]));
    try { return { ip: await echoOnce(e), fresh: true, host: hostOf(e[1]) }; } catch (x) { err = x; }
  }
  try { return { ip: await echoOnce(pool[0]), fresh: false, host: hostOf(pool[0][1]) }; } catch (x) { throw err || x; }
}
const traceFresh = hosts => echoFresh(tracePool(hosts));

// ───────── 线路：各条分流线路实际的出口 ─────────
// 请求按手机上代理客户端的分流规则走各自线路，由回显服务告诉我们它看到的访问者 IP。
// ① 用 Claude 自己的 Cloudflare 域名池（ChatGPT 用它自己的，单独判定）；②③④ 用线路表里的回显地址，
// ④（🌍 国外网站）再接上 Cloudflare 那组域名作后备（它们本来就落到兜底规则，走的也是 🌍）。
// YouTube 的 report_mapping 不允许网页跨域读取，视频线路按分流规则测 📺 影音高速的回显。
const AI_POOLS = { Claude: tracePool(TRACE_POOLS.Claude), ChatGPT: tracePool(TRACE_POOLS.ChatGPT) };
const LINE_POOLS = Object.fromEntries(LINES.slice(1).map(l =>
  [l.id, l.id === "other" ? l.echo.concat(tracePool(TRACE_POOLS.default)) : l.echo]));

// ───────── 测速（10-26）─────────
// 视频、TikTok、其他外网三条线路各测各的（线路表的 speed），只用现有分流规则本来就会走到这条线路的地址，
// 而且就是这些服务自己的 CDN：视频测 YouTube 的图片服务器 i.ytimg.com（→ 📺 影音高速），TikTok 测它自己的
// sf16-va.tiktokcdn.com（→ 🎵 TikTok），其他外网测 speed.cloudflare.com（落到兜底 → 🌍），都允许跨域读取。
// 有 trace 的（只有 Cloudflare）先取测速连接看到的出口（顺便建好连接），没有的先发一次 ping 预热（不计入）；
// 再在这条连接上发几个小请求（HEAD 或 GET）取中位数当延迟，最后 streams 路并发下载 SPEED.seconds 秒或
// SPEED.max_bytes 字节算带宽。三条线路依次测、不同时测，免得互相抢带宽；有 trace 的线路出口和回显到的不一样时，
// 报告里提示（多半沿用了切换节点前的旧连接）。
const median = xs => {
  const s = [...xs].sort((a, b) => a - b), m = s.length >> 1;
  return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null;
};
// 测速域名：有 trace 用 trace 的，没有用 ping 的（线路表里同一主机）
const speedHost = sp => hostOf(sp.trace || sp.ping);

/** 下载测带宽：streams 路并发，各路从 urls 里轮流取下一个地址（共享一个递增下标）下载；某个地址回非 2xx
 *  就记下、以后都跳过它，换下一个，不让整路失败。从第一块数据到达时起计时（这一块不计入），
 *  到时间或字节数上限就中止。返回 {mbps, bytes}；数据太少算不出时抛错（全部地址都失败时报最后一个 HTTP 状态）。 */
async function download(urls, streams) {
  const ac = new AbortController();
  const guard = setTimeout(() => ac.abort(), SPEED.seconds * 1000 + TIMEOUT);
  let bytes = 0, t0 = null, t1 = null, next = 0, httpErr = null;
  const bad = new Set(); // 回过非 2xx 的地址
  const pick = () => {
    for (let k = 0; k < urls.length; k++) {
      const u = urls[next++ % urls.length];
      if (!bad.has(u)) return u;
    }
    return null;
  };
  const stream = async () => {
    while (!ac.signal.aborted) {
      const url = pick();
      if (url === null) throw httpErr || new Error("没有可用的下载地址");
      const r = await fetch(url, { cache: "no-store", credentials: "omit", signal: ac.signal });
      if (!r.ok) {
        bad.add(url);
        httpErr = new Error(`HTTP ${r.status}`);
        if (r.body) r.body.cancel().catch(() => { /* 出错的响应体不读了 */ });
        continue;
      }
      if (!r.body || !r.body.getReader) throw new Error("浏览器不支持流式读取");
      const reader = r.body.getReader();
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break; // 这个地址下完了，接着下下一个
          const now = performance.now();
          if (t0 === null) { t0 = now; continue; }
          bytes += value.byteLength;
          t1 = now;
          if (bytes >= SPEED.max_bytes || now - t0 >= SPEED.seconds * 1000) { ac.abort(); return; }
        }
      } finally {
        reader.cancel().catch(() => { /* 已经读完或已中止 */ }); // 不再读的那一路也要停下，别在后台继续下载
      }
    }
  };
  const rs = await Promise.allSettled(Array.from({ length: streams }, stream));
  clearTimeout(guard);
  if (t0 === null || t1 === null || t1 - t0 < 100 || bytes < 100000) {
    const err = rs.map(r => r.reason).find(e => e && e.name !== "AbortError");
    if (err && err instanceof TypeError) throw new Error("连接失败");
    throw err || new Error(`超过 ${(SPEED.seconds * 1000 + TIMEOUT) / 1000} 秒数据还太少，算不出带宽`);
  }
  return { mbps: bytes * 8 / ((t1 - t0) / 1000) / 1e6, bytes };
}

/** 一条线路的测速：{host, ip（测速连接的出口；没有 trace 的线路为 null）, ms, mbps, bytes, error}。
 *  第一次请求（trace 或预热）失败就不再往下测，和桌面版 speed_test 一样。 */
async function speedTest(sp) {
  const out = { host: speedHost(sp), ip: null, ms: null, mbps: null, bytes: 0, error: null };
  try {
    if (sp.trace) out.ip = parseTrace(await fetchText(sp.trace));
    else await fetchText(sp.ping, sp.ping_method); // 预热：只为建好连接，不计入延迟
  } catch (e) {
    out.error = e.message;
    return out;
  }
  const samples = [];
  for (let i = 0; i < SPEED.pings; i++) {
    const t = performance.now();
    try { await fetchText(sp.ping, sp.ping_method); samples.push(performance.now() - t); } catch (e) { /* 少一个样本 */ }
  }
  out.ms = median(samples);
  try { Object.assign(out, await download(sp.down, sp.streams)); } catch (e) { out.error = e.message; }
  return out;
}

// ───────── 数据源 ─────────
// proxycheck / ip2location / ip-api 不允许网页跨域读取（ip-api 免费版还只有 http），手机网页版用不了；
// 换成同样免 key、允许跨域的 freeipapi 补上「匿名标记」这一维
const SOURCES = [
  { key: "ipinfo", zh: "基础信息", link: "https://ipinfo.io/{ip}",
    fn: ip => getJSON(`https://ipinfo.io/${ip}/json`).then(d => { delete d.readme; return check(d); }) },
  { key: "iplocate", zh: "隐私标记", link: "https://iplocate.io/api/lookup/{ip}",
    fn: ip => getJSON(`https://iplocate.io/api/lookup/${ip}`).then(d => {
      check(d, "privacy");
      delete d.abuse; // 运营商的投诉联系方式，与判定无关
      return d;
    }) },
  { key: "ipquery", zh: "风险标记", link: "https://api.ipquery.io/{ip}?format=json",
    fn: ip => getJSON(`https://api.ipquery.io/${ip}?format=json`).then(d => check(d, "risk")) },
  // 旧地址 /api/json/ 现在会 307 跳到 /api/v1/json/，直接用新地址省一次跳转
  { key: "freeipapi", zh: "代理标记", link: "https://free.freeipapi.com/api/v1/json/{ip}",
    fn: ip => getJSON(`https://free.freeipapi.com/api/v1/json/${ip}`).then(d => {
      check(d);
      if (typeof d.isProxy !== "boolean") throw new Error("返回里没有 isProxy 字段（可能被限流或改了免费政策）");
      delete d.timeZones; // 整个国家的时区列表，太长且与判定无关
      return d;
    }) },
  // 免 key、允许跨域，只回一个字母：Y = 在代理 / VPN / 机房名单上，N = 不在。
  // 实测运营商 IP 回 N，机房、公共 DNS、Tor 出口回 Y，名单主要按机房 IP 段收录，所以归入「数据中心」投票
  { key: "blackbox", zh: "机房名单", link: "https://blackbox.ipinfo.app/lookup/{ip}",
    fn: ip => fetchText(`https://blackbox.ipinfo.app/lookup/${ip}`).then(t => {
      const v = t.trim().toUpperCase();
      if (v !== "Y" && v !== "N") throw new Error("返回格式异常");
      return { ip, listed: v === "Y" };
    }) },
  { key: "ipapi.is", zh: "综合风控", link: "https://api.ipapi.is/?q={ip}",
    fn: ip => {
      const q = new URLSearchParams({ q: ip });
      if (ipapiKey()) q.set("key", ipapiKey());
      return getJSON("https://api.ipapi.is/?" + q).then(d => { check(d); delete d.docs; return d; });
    } },
];
// 参与风险判定（投票或给风险分）的数据源；查询失败时在结论里注明
const RISK_SOURCES = ["iplocate", "ipquery", "freeipapi", "blackbox", "ipapi.is"];
/** 实际参与判定的数据源：ipapi.is 没有 key 时不返回风控字段，不算。 */
const voteSources = () => RISK_SOURCES.filter(k => k !== "ipapi.is" || ipapiKey());
/** 本次要查的数据源：ipapi.is 没有 key 时只给归属信息，判定用不上，干脆不查。 */
const activeSources = () => SOURCES.filter(s => s.key !== "ipapi.is" || ipapiKey());
const SOURCE_BY_KEY = Object.fromEntries(SOURCES.map(s => [s.key, s]));

// ───────── 结果缓存 ─────────
// 同一 IP 的数据库判定短时间内不会变，打开页面时复用结果以节省免费额度（iplocate 免 key 每天只有 50 次）；
// 手动点「重新检测」时 force 为 true，一律重新查
async function cachedFetch(key, ip, force) {
  const tag = key === "ipapi.is" && ipapiKey() ? `${key}+key` : key; // 配了 key 后不复用匿名结果
  const ck = `${tag}|${ip}`;
  const now = Date.now() / 1000;
  const hit = store.get("cache", {})[ck];
  if (!force && hit && isObj(hit.data) && now - hit.t >= 0 && now - hit.t < CACHE_TTL) {
    return { ...hit.data, _cache_age: Math.floor(now - hit.t) };
  }
  const data = await SOURCE_BY_KEY[key].fn(ip);
  const cache = Object.fromEntries(Object.entries(store.get("cache", {}))
    .filter(([, v]) => v && typeof v.t === "number" && now - v.t < CACHE_TTL));
  cache[ck] = { t: now, data };
  store.set("cache", cache);
  return data;
}

/** 按线路并发检测：① Claude、② 视频、③ TikTok、④ 其他外网各自取出口 IP，另测 ChatGPT 的出口。
 *  ① 只看 Claude（aiExit）：Claude 连不上就是「① 线路不通」——不拿 ChatGPT、🌍 或别的出口顶替，
 *  不查 ① 的数据源，②③④ 和 ChatGPT 照常检测；①②③④ 和 ChatGPT 全都不通才报「无法获取出口 IP」。① 查全部数据源，
 *  其他线路和 ChatGPT 里和它不同的 IP 按 IP 去重，各查一次参与判定的数据源。手动重测时 ① 不用缓存，
 *  其他 IP 仍复用 10 分钟缓存（一次最多 5 个 IP，iplocate 免 key 每天只有 50 次）。 */
async function runAll(log, force) {
  log("正在按线路获取出口：Claude、ChatGPT、视频、TikTok、其他外网（换新连接）");
  const results = {}, routes = {}, extra = {}, lines = {}, stale = [], hosts = {};
  const ai = {};
  for (const name of Object.keys(AI_POOLS)) {
    ai[name] = echoFresh(AI_POOLS[name]).then(r => {
      routes[name] = r.ip;
      hosts[name] = r.host;
      if (!r.fresh) stale.push(name);
      log(`✓ ${name} 看到的 IP：${r.ip}`, "ok");
      return r.ip;
    }, e => { routes[name] = e; log(`× ${name} 出口检测失败`, "bad"); throw e; });
    ai[name].catch(() => { /* 由下面的 await 处理 */ });
  }
  const lineJobs = LINES.slice(1).map(l => {
    lines[l.id] = { ip: null, host: "", error: null };
    return echoFresh(LINE_POOLS[l.id]).then(r => {
      Object.assign(lines[l.id], { ip: r.ip, host: r.host });
      if (!r.fresh) stale.push(l.name);
      log(`✓ ${l.name} 线路出口：${r.ip}`, "ok");
      return r.ip;
    }, e => { lines[l.id].error = e.message; log(`× ${l.name} 线路出口检测失败`, "bad"); return null; });
  });
  const gptJob = ai.ChatGPT.catch(() => null);
  // 测速：等各线路取完出口再开始（不和取出口抢带宽），三条线路依次测
  const speed = {};
  const speedJob = (async () => {
    await Promise.all(lineJobs);
    for (const l of LINES) {
      if (!l.speed) continue;
      speed[l.id] = { host: speedHost(l.speed), ip: null, ms: null, mbps: null, bytes: 0, error: null, pending: true };
      const r = await speedTest(l.speed);
      speed[l.id] = r;
      const g = speedGrade(r.ms, r.mbps);
      log(`${g.state === "unknown" ? "×" : "✓"} ${l.title} 测速：延迟 ${fmtMs(r.ms)} · 带宽 ${fmtMbps(r.mbps)}`
        + (r.error ? `（${r.error}）` : ""), g.state === "unknown" ? "bad" : "ok");
    }
  })();

  // ① 只等 Claude：Claude 失败就是 ① 不通（ChatGPT 走 💬 ChatGPT，不能顶替）
  const claude = await ai.Claude.catch(() => null);
  const ae = aiExit(claude);
  const { ip, frm } = ae;
  // 总时限从这里起算一次：下面两次等待都只等剩余时间（以前 ① 不通时各等一个 RUN_DEADLINE，最坏要两倍）
  const deadline = Date.now() + RUN_DEADLINE;
  const left = () => Math.max(0, deadline - Date.now());
  if (ae.down) {
    // ①②③④ 和 ChatGPT 全都不通才算断网（每条线路自己有超时，失败时返回 null，不会抛错）
    const got = await Promise.race([Promise.all([...lineJobs, gptJob]), sleep(left()).then(() => null)]);
    if (got && got.every(x => !x)) throw new Error("无法获取出口 IP，请检查网络");
    log(`× ${ae.title}：${ae.text}`, "bad");
    log("其他线路和 ChatGPT 照常检测，出口按 IP 去重后各查一次数据源");
  } else {
    log(`Claude 出口：${ip}`, "ok");
  }
  const todo = ae.down ? [] : activeSources();
  if (!ae.down) log(`正在并发查询 ${todo.length} 个数据源${force ? "（不用缓存）" : ""}，其他线路和 ChatGPT 的出口按 IP 去重后各查一次`);
  const jobs = todo.map(s => cachedFetch(s.key, ip, force).then(
    v => { results[s.key] = v; log(`✓ ${s.zh}（${s.key}）`, "ok"); },
    e => { results[s.key] = e; log(`× ${s.zh}（${s.key}）失败：${e.message}`, "bad"); }));
  const extraFor = rip => {
    if (!rip || rip === ip || rip in extra) return null;
    extra[rip] = {};
    return Promise.all(voteSources().map(k => cachedFetch(k, rip, false).then(
      v => { extra[rip][k] = v; }, e => { extra[rip][k] = e; })));
  };
  const extraJobs = [...lineJobs, gptJob].map(p => p.then(extraFor));
  await Promise.race([Promise.allSettled([...jobs, ...extraJobs, speedJob]), sleep(left())]);

  // 到总时限还没返回的一律记为超时，不再等
  const late = () => new Error(`超过 ${RUN_DEADLINE / 1000} 秒未返回`);
  for (const s of todo) if (!(s.key in results)) results[s.key] = late();
  for (const name of Object.keys(AI_POOLS)) if (!(name in routes)) routes[name] = late();
  for (const l of LINES.slice(1)) if (!lines[l.id].ip && !lines[l.id].error) lines[l.id].error = late().message;
  for (const rip of Object.keys(extra)) for (const k of voteSources()) if (!(k in extra[rip])) extra[rip][k] = late();
  for (const l of LINES) {
    if (!l.speed) continue;
    const sp = speed[l.id];
    if (!sp) speed[l.id] = { host: speedHost(l.speed), ip: null, ms: null, mbps: null, bytes: 0, error: "没来得及测" };
    else if (sp.pending) speed[l.id] = { ...sp, pending: false, error: late().message };
  }
  const seen = name => (typeof routes[name] === "string" ? routes[name] : null);
  lines.ai = ae.down ? { ip: null, frm: null, host: "", down: true, error: ae.title, claude: null }
    : { ip, frm, host: hosts.Claude || frm, down: false, claude: ip };
  lines.chatgpt = seen("ChatGPT") ? { ip: seen("ChatGPT"), host: hosts.ChatGPT || "", error: null }
    : { ip: null, host: "", error: routes.ChatGPT instanceof Error ? routes.ChatGPT.message : "未返回" };
  // 拷一份：总时限过后还没测完的线路，后台回来的结果不再改这次的报告
  return { ip, results, routes, extra, lines, stale: [...stale], speed: JSON.parse(JSON.stringify(speed)) };
}

// ───────── 翻译 ─────────
function g(d, ...keys) {
  let cur = d;
  for (const k of keys) {
    if (!isObj(cur) || !(k in cur)) return null;
    cur = cur[k];
  }
  return cur === null || cur === undefined || cur === "" ? null : cur;
}

/** 统一各数据源的布尔表达：true/false 或 "yes"/"no"，其他视为没表态。 */
function yn(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "string" && ["yes", "no"].includes(v.toLowerCase())) return v.toLowerCase() === "yes";
  return null;
}

function zhValue(k, v) {
  if (v === null || v === undefined || v === "") return "—";
  if (typeof v === "boolean") return v ? "是" : "否";
  if (typeof v === "object") return JSON.stringify(v);
  const sv = String(v).trim();
  if (!sv) return "—";
  const low = sv.toLowerCase();
  if (low === "yes" || low === "no") return low === "yes" ? "是" : "否";
  if (["country", "country_code", "countryCode", "isocode"].includes(k) && /^[A-Za-z]{2}$/.test(sv)) {
    return `${COUNTRY_ZH[sv.toUpperCase()] || sv} (${sv.toUpperCase()})`;
  }
  if (k === "country_name") return sv.length === 2 ? (COUNTRY_ZH[sv.toUpperCase()] || sv) : sv;
  if (["continent", "continent_code", "continentcode", "continentCode"].includes(k) && sv.length === 2) {
    return CONTINENT_ZH[sv.toUpperCase()] || sv;
  }
  if (k === "risk" || k === "risk_score") return /^\d+$/.test(sv) ? `${sv} / 100` : (RISK_LEVEL_ZH[low] || sv);
  if (k === "type") return NET_TYPE_ZH[low] || sv;
  if (k === "usage_type") return USAGE_TYPE_ZH[sv.toUpperCase()] || sv;
  if (k === "fraud_score") return `${sv} / 100`;
  return sv;
}

// ───────── 综合判定（多源交叉验证）─────────
/** {数据源: 结果}，失败或缺失的数据源给空对象，缓存标记 _cache_age 剥掉。 */
function sourceDicts(results) {
  const out = {};
  for (const s of SOURCES) {
    const v = results[s.key];
    out[s.key] = isObj(v) ? Object.fromEntries(Object.entries(v).filter(([k]) => !k.startsWith("_"))) : {};
  }
  return out;
}

/** 把各数据源的判断汇总到每个维度：{维度: [[数据源, true/false], ...]}，没表态的源不计入。
 *  「代理 IP」只收严格口径（明确是代理）；freeipapi 的 isProxy、iplocate 的 is_anonymous
 *  是宽口径（代理、VPN、Tor 任一），归入「匿名标记」。 */
function collectEvidence(src) {
  const ipapi = src["ipapi.is"], fip = src.freeipapi;
  const priv = g(src.iplocate, "privacy") || {}, risk = g(src.ipquery, "risk") || {};
  const votes = {
    vpn: [["ipapi.is", yn(g(ipapi, "is_vpn"))], ["iplocate", yn(g(priv, "is_vpn"))], ["ipquery", yn(g(risk, "is_vpn"))]],
    proxy: [["ipapi.is", yn(g(ipapi, "is_proxy"))], ["iplocate", yn(g(priv, "is_proxy"))], ["ipquery", yn(g(risk, "is_proxy"))]],
    anon: [["freeipapi", yn(g(fip, "isProxy"))], ["iplocate", yn(g(priv, "is_anonymous"))]],
    // blackbox 是手机版独有的数据源（桌面版没有）；名单主要按机房 IP 段收录，算作「数据中心」的一票
    datacenter: [["ipapi.is", yn(g(ipapi, "is_datacenter"))], ["iplocate", yn(g(priv, "is_hosting"))],
                 ["ipquery", yn(g(risk, "is_datacenter"))], ["blackbox", yn(g(src.blackbox, "listed"))]],
    tor: [["ipapi.is", yn(g(ipapi, "is_tor"))], ["iplocate", yn(g(priv, "is_tor"))], ["ipquery", yn(g(risk, "is_tor"))]],
    abuser: [["ipapi.is", yn(g(ipapi, "is_abuser"))], ["iplocate", yn(g(priv, "is_abuser"))]],
    crawler: [["ipapi.is", yn(g(ipapi, "is_crawler"))]],
    mobile: [["ipapi.is", yn(g(ipapi, "is_mobile"))], ["ipquery", yn(g(risk, "is_mobile"))]],
  };
  return Object.fromEntries(Object.entries(votes).map(([k, vs]) => [k, vs.filter(([, v]) => v !== null)]));
}

/** 返回 [0-100 风险分, 来源]。 */
function riskScore(src) {
  const s = String(g(src.ipquery, "risk", "risk_score") ?? "");
  return /^\d+$/.test(s) && +s <= 100 ? [+s, "ipquery"] : [null, null];
}

const tally = votes => [votes.filter(([, v]) => v).length, votes.length];

/** 维度结论：unknown 无数据 / no 全部为否 / yes 过半为是 / doubt 意见不一（含打平）。 */
function dimState(votes) {
  const [yes, n] = tally(votes);
  if (n === 0) return "unknown";
  if (yes === 0) return "no";
  return yes * 2 > n ? "yes" : "doubt";
}

/** failed 为查询失败的风控数据源名。 */
function computeVerdict(ev, score, failed) {
  // 核心维度（VPN / 匿名标记 / 数据中心）至少两个有数据源表态，或者有风险分，才下结论
  if (["vpn", "anon", "datacenter"].filter(k => ev[k].length).length < 2 && score === null) {
    const why = failed.length ? `${failed.join("、")} 查询失败，` : "";
    return { level: "数据不足", sentence: `${why}风控数据不足，无法判定，请稍后重新检测`, color: "v-unk", hit: [], score: null };
  }
  const states = Object.fromEntries(Object.entries(ev).map(([k, v]) => [k, dimState(v)]));
  const critical = DIMENSIONS.some(([k, , s]) => s === "critical" && states[k] === "yes");
  const tie = k => { const [yes, n] = tally(ev[k]); return n > 0 && yes * 2 === n; };
  // 严重项只要有源说是、一般风险项打平（一半源说是），都至少算中等风险；
  // 一般风险项只有少数源说是，才维持「较为干净」并标注存疑
  const risky = DIMENSIONS.some(([k, , s]) => s === "risk" && (states[k] === "yes" || tie(k)))
    || DIMENSIONS.some(([k, , s]) => s === "critical" && states[k] === "doubt");
  const hit = DIMENSIONS.filter(([k, , s]) => states[k] === "yes" && s !== "info").map(([, zh]) => zh);
  const doubt = DIMENSIONS.filter(([k, , s]) => states[k] === "doubt" && s !== "info")
    .map(([k, zh]) => { const [yes, n] = tally(ev[k]); return `${zh}（${yes}/${n} 源）`; });

  let level, color;
  if (critical || (score !== null && score >= 67)) [level, color] = ["高风险", "v-bad"];
  else if (risky || (score !== null && score >= 34)) [level, color] = ["中等风险", "v-warn"];
  else [level, color] = ["较为干净", "v-ok"];

  const doubtText = doubt.length ? "存疑：" + doubt.join("、") + "，数据源意见不一" : "";
  let sentence;
  if (hit.length) sentence = "检测到：" + hit.join("、") + (doubt.length ? `；${doubtText}` : "");
  // 圆环显示的是多源综合分，这里点明是 ipquery 一家的分数偏高
  else if (score !== null && score >= 34) sentence = `ipquery 风险分偏高（${score}/100），建议进一步排查` + (doubt.length ? `；${doubtText}` : "");
  else if (doubt.length) sentence = doubtText;
  else if (states.mobile === "yes") sentence = "未发现风险标志（移动网络出口）";
  else sentence = "未触发明显风险标志";
  if (failed.length) sentence += `；${failed.join("、")} 查询失败，结论基于其余数据源`;
  return { level, sentence, color, hit, score };
}

// ───────── 综合分与可信度（10-18 已同步到桌面版 ipcheck.py 的 composite_score 等，改这里要一起改并对拍）─────────
// 圆环以前只显示 ipquery 一家的 risk_score，会和多源投票的结论打架（判成中等风险，圆环却是绿色 30 分）。
// 现在按公开的权重把各维度的投票和 ipquery 分数加起来，再落进结论等级对应的区间，颜色和结论必然一致。
const DIM_WEIGHT = { critical: 45, risk: 25 }; // 每个维度满分；按认为「是」的数据源占比折算
const IPQUERY_WEIGHT = 0.3;                     // ipquery 风险分（0-100）折算进综合分的比例
const BANDS = { "较为干净": [0, 33], "中等风险": [34, 66], "高风险": [67, 100] };

/** 返回 {score, raw, parts, band}：parts 是每一项的得分明细，raw 是落区间前的合计。 */
function compositeScore(ev, ipqScore, level) {
  const parts = [];
  for (const [k, zh, sev] of DIMENSIONS) {
    if (!(sev in DIM_WEIGHT)) continue; // 「移动网络」之类只作参考，不计分
    const [yes, n] = tally(ev[k] || []);
    if (n) parts.push({ key: k, label: zh, yes, n, w: DIM_WEIGHT[sev], pts: DIM_WEIGHT[sev] * yes / n });
  }
  if (ipqScore !== null) parts.push({ key: "ipquery", label: "ipquery 风险分", raw: ipqScore, pts: ipqScore * IPQUERY_WEIGHT });
  const raw = Math.min(100, parts.reduce((s, p) => s + p.pts, 0));
  const band = BANDS[level] || null;
  const score = band ? Math.round(Math.min(band[1], Math.max(band[0], raw))) : null;
  return { score, raw, parts, band };
}

/** 各维度的多数意见：true / false，打平为 null，没人表态为 undefined。 */
function consensus(ev) {
  return Object.fromEntries(Object.entries(ev).map(([k, votes]) => {
    const [yes, n] = tally(votes);
    return [k, n === 0 ? undefined : yes * 2 > n ? true : yes * 2 < n ? false : null];
  }));
}

/** 每个成功返回的数据源是否和多数意见一致（只看计分的维度）。
 *  返回 {agree, total, per: [{src, dims, against}]}：against 是这个源和多数不同（或打平）的维度名。 */
function agreement(ev, okSources) {
  const cons = consensus(ev);
  const scored = DIMENSIONS.filter(([, , s]) => s in DIM_WEIGHT);
  const per = okSources.map(src => {
    const mine = scored.flatMap(([k, zh]) => (ev[k] || []).filter(([s]) => s === src).map(([, v]) => [k, zh, v]));
    return { src, dims: mine.length, against: mine.filter(([k, , v]) => cons[k] !== v).map(([, zh]) => zh) };
  }).filter(p => p.dims);
  return { agree: per.filter(p => !p.against.length).length, total: per.length, per };
}

/** 可信度：看有几个数据源成功返回、意见是否一致。 */
function confidence(ev, ok, failed, level) {
  if (!(level in BANDS)) return { level: "低", dots: 1, why: "风控数据不足" };
  const disputed = DIMENSIONS.filter(([k, , s]) => {
    const [yes, n] = tally(ev[k] || []);
    return s in DIM_WEIGHT && n >= 2 && yes > 0 && yes < n;
  }).map(([, zh]) => zh);
  const why = [];
  if (failed.length) why.push(`${failed.join("、")} 查询失败`);
  if (disputed.length) why.push(`${disputed.join("、")} 各源意见不一`);
  if (ok.length < 3 && !failed.length) why.push(`只有 ${ok.length} 个数据源`);
  let lv;
  if (ok.length < 2 || disputed.length >= 2) lv = "低";
  else if (failed.length || disputed.length || ok.length < 3) lv = "中";
  else lv = "高";
  return { level: lv, dots: { 高: 3, 中: 2, 低: 1 }[lv], why: why.join("；") || `${ok.length} 个数据源全部返回，意见一致` };
}

/** 对一组数据源结果给出完整判定。 */
function assess(results) {
  const src = sourceDicts(results);
  const ev = collectEvidence(src);
  const [score, scoreSrc] = riskScore(src);
  const voters = voteSources().filter(k => k in results);
  const failed = voters.filter(k => !isObj(results[k]));
  const ok = voters.filter(k => isObj(results[k])).sort();
  const verdict = computeVerdict(ev, score, failed);
  return { src, ev, score, scoreSrc, verdict, ok, failed,
    comp: compositeScore(ev, score, verdict.level), agree: agreement(ev, ok), conf: confidence(ev, ok, failed, verdict.level) };
}

// ───────── 各线路是否同出口（与桌面版 ipcheck.py 的 group_exits 对拍过，改这里要一起改）─────────
// 本应分开走的线路对：①② / ①③ / ②③ 同出口说明分流没生效，要提醒；
// ④（🌍 国外网站）平时优先走家宽，和 ① 同出口属正常；家宽不可用时会临时走机房，和 ②③ 同出口也说得通。
const WARN_PAIRS = [["ai", "video"], ["ai", "tiktok"], ["video", "tiktok"]];
const isWarnPair = (a, b) => WARN_PAIRS.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

/** lines：{线路 id: IP 或 null（失败）}；countries：{IP: 国家代码或 null}。返回
 *  {level: none/info/warn, banner, groups: [[同出口的线路 id…]], lines: {id: {ip, same_as, country, expect, region_ok, level, notes}}}。 */
function groupExits(lines, countries) {
  const order = LINES.map(l => l.id);
  const name = Object.fromEntries(LINES.map(l => [l.id, l.name]));
  const expectOf = Object.fromEntries(LINES.map(l => [l.id, l.expect || null]));
  const ips = {};
  for (const lid of order) { const v = lines[lid]; ips[lid] = typeof v === "string" && v ? v : null; }
  const ok = order.filter(lid => ips[lid]);
  const fam = Object.fromEntries(ok.map(lid => [lid, ips[lid].includes(":") ? "v6" : "v4"]));
  const groups = [];
  for (const lid of ok) {
    const grp = ok.filter(o => ips[o] === ips[lid]);
    if (grp.length > 1 && !groups.some(x => x.join() === grp.join())) groups.push(grp);
  }
  const allSame = ok.length >= 3 && groups.length === 1 && groups[0].length === ok.length;

  const out = {}, warnPairs = [];
  for (const lid of order) {
    const ip = ips[lid], exp = expectOf[lid];
    let cc = null;
    if (ip) { const c = countries[ip]; cc = typeof c === "string" && c ? c.toUpperCase() : null; }
    const same = ip ? ok.filter(o => o !== lid && ips[o] === ip) : [];
    const regionOk = ip && exp && cc ? cc === exp : null;
    let level = "none";
    const notes = [];
    if (ip && lid !== "ai") {
      if (allSame) {
        level = "warn";
        notes.push("与其他线路都是同一个出口，分流没有生效");
      } else {
        for (const o of same) {
          if (isWarnPair(lid, o)) {
            level = "warn";
            notes.push(`与「${name[o]}」同出口，本应分开走`);
            if (lid !== "ai" && o !== "ai" && !warnPairs.some(([a, b]) => a === o && b === lid)) warnPairs.push([lid, o]);
          } else if (o === "ai") {
            if (level === "none") level = "info";
            notes.push(`与「${name[o]}」同出口（国外网站默认优先走家宽，属正常）`);
          } else {
            if (level === "none") level = "info";
            notes.push(`与「${name[o]}」同出口（家宽不可用时国外网站会临时改走机房节点）`);
          }
        }
        if (isWarnPair(lid, "ai") && same.includes("ai")) warnPairs.push(["ai", lid]);
      }
      if (regionOk === false) {
        level = "warn";
        notes.push(`预期${COUNTRY_ZH[exp] || exp}，实测${COUNTRY_ZH[cc] || cc}`);
      }
      if (ips.ai && fam[lid] !== fam.ai) notes.push("和 Claude 的 IP 版本不同（IPv4 / IPv6），无法比较是否同出口");
    }
    out[lid] = { ip, same_as: same, country: cc, expect: exp, region_ok: regionOk, level, notes };
  }

  let banner = "";
  if (allSame) {
    banner = `这几条线路走的是同一出口（${ok.map(o => name[o]).join("、")}）：本设备的代理可能没有加载分流规则、开了全局模式，或订阅还没更新`;
  } else if (warnPairs.length) {
    banner = warnPairs.map(([a, b]) => `「${name[a]}」和「${name[b]}」走的是同一出口`).join("；")
      + "。它们本应分开走，可能是代理没有加载分流规则、开了全局模式，或订阅还没更新";
  }
  const levels = Object.values(out).map(v => v.level);
  const level = allSame || levels.includes("warn") ? "warn" : levels.includes("info") ? "info" : "none";
  return { level, banner, groups, lines: out };
}

/** ① 的出口 = Claude 看到的 IP；没取到就是「线路不通」——不拿 ChatGPT、默认出口或别的线路顶替
 *  （ChatGPT 走 💬 ChatGPT，家宽挂了会改走机房，它的出口不代表 Claude）。返回 {ip, frm, down, title, text}。和桌面版 ai_exit 对拍。 */
function aiExit(claude) {
  if (typeof claude === "string" && claude) return { ip: claude, frm: "Claude", down: false, title: "", text: "" };
  return { ip: null, frm: null, down: true, title: AI_DOWN.title, text: AI_DOWN.text };
}

/** ChatGPT 这一行（用户 10-21 决定：出口不在中国大陆 / 中国香港 / 中国澳门即合格，机房也可以）。ip 为 ChatGPT 看到的出口（null = 连不上），
 *  country 为国家代码，datacenter 为机房投票（true / false / null = 不确定），claudeIp 为 ① 的出口（null = ① 不通）。
 *  返回 {state: ok/bad/unknown/down, ip, country, place, kind, text, same_as_claude, note}。和桌面版 chatgpt_check 对拍。 */
function chatgptCheck(ip, country, datacenter, claudeIp) {
  ip = typeof ip === "string" && ip ? ip : null;
  const cc = typeof country === "string" && /^[A-Za-z]{2}$/.test(country) ? country.toUpperCase() : null;
  const out = { state: "down", ip, country: cc, place: null, kind: null, text: GPT_TEXT.down, same_as_claude: null, note: "" };
  if (!ip) return out;
  out.kind = datacenter === true ? "机房" : datacenter === false ? "家宽" : "家宽 / 机房不确定";
  if (cc) out.place = GPT_BLOCKED[cc] || COUNTRY_ZH[cc] || cc;
  if (cc && cc in GPT_BLOCKED) Object.assign(out, { state: "bad", text: GPT_TEXT.bad.replace("{place}", GPT_BLOCKED[cc]) });
  else if (cc) Object.assign(out, { state: "ok", text: GPT_TEXT.ok });
  else Object.assign(out, { state: "unknown", text: GPT_TEXT.unknown });
  claudeIp = typeof claudeIp === "string" && claudeIp ? claudeIp : null;
  if (claudeIp) {
    out.same_as_claude = claudeIp === ip;
    out.note = claudeIp === ip ? "与 Claude 同出口" : "与 Claude 出口不同，属正常（ChatGPT 允许走机房，Claude 只走家宽）";
  } else {
    out.note = "Claude 不通不影响 ChatGPT（家宽不可用时它会改走非香港机房节点）";
  }
  return out;
}

// ───────── 「绝对干净」与测速评级（10-26，和桌面版 ai_clean / speed_grade 对拍，改这里要一起改）─────────
const CLEAN_PROXY_DIMS = ["vpn", "proxy", "anon", "tor"];
const CLEAN_FLAG_DIMS = ["abuser", "crawler"];
const CLEAN_TITLE = { clean: "绝对干净", doubt: "有疑点", dirty: "不干净", unknown: "无法确认" };
const SPEED_LABEL = { fast: "快", ok: "一般", slow: "慢", unknown: "未测出" };
/** 有限的非负数原样返回，其他一律 null。 */
const num = x => (typeof x === "number" && isFinite(x) && x >= 0 ? x : null);

/** AI 出口（Claude）「绝对干净」的四项检查（用户 10-26：「AI 的出口要绝对干净」）：
 *  ① 住宅宽带：「数据中心」所有表态的数据源都说否，且至少两个源表态；② 不是代理 / VPN / Tor：这四项所有表态都是否，合计至少两票；
 *  ③ 风险分低、没有滥用记录：综合分 ≤ CLEAN_MAX，且滥用源、爬虫没有源说是；④ 地区合格：不在中国大陆 / 香港 / 澳门。
 *  每项 ok / warn / bad / unk；有 bad = dirty，否则有 warn = doubt，否则有 unk = unknown，全 ok = clean。
 *  返回 {state, title, text, checks: [{key, label, state, text}]}。 */
function aiClean(ev, compScore, country) {
  const zh = Object.fromEntries(DIMENSIONS.map(([k, z]) => [k, z]));
  const checks = [];
  const add = (key, label, state, text) => checks.push({ key, label, state, text });

  let label = "住宅宽带";
  const [dy, dn] = tally(ev.datacenter || []);
  if (dn === 0) add("residential", label, "unk", "没有数据源给出判断");
  else if (dy === 0) {
    if (dn >= 2) add("residential", label, "ok", `${dn} 个数据源都说不是机房`);
    else add("residential", label, "unk", "只有 1 个数据源表态，不足以确认");
  } else add("residential", label, dy * 2 > dn ? "bad" : "warn", `${dy}/${dn} 个数据源说是机房`);

  label = "不是代理 / VPN";
  let pn = 0;
  const bad = [], warn = [];
  for (const k of CLEAN_PROXY_DIMS) {
    const [y, n] = tally(ev[k] || []);
    pn += n;
    if (y && y * 2 > n) bad.push(`${zh[k]}（${y}/${n} 源）`);
    else if (y) warn.push(`${zh[k]}（${y}/${n} 源）`);
  }
  if (bad.length) add("proxy", label, "bad", "说是：" + bad.concat(warn).join("、"));
  else if (warn.length) add("proxy", label, "warn", "少数数据源说是：" + warn.join("、"));
  else if (pn === 0) add("proxy", label, "unk", "没有数据源给出判断");
  else if (pn < 2) add("proxy", label, "unk", "只有 1 项判断，不足以确认");
  else add("proxy", label, "ok", `${pn} 项判断全部说不是`);

  label = "风险分低";
  const flags = [];
  for (const k of CLEAN_FLAG_DIMS) {
    const [y, n] = tally(ev[k] || []);
    if (y) flags.push(`${zh[k]}（${y}/${n} 源说是）`);
  }
  const s = num(compScore);
  if (s === null) add("score", label, "unk", "风控数据不足，没有综合分");
  else {
    let st = s <= CLEAN_MAX ? "ok" : s <= BANDS["较为干净"][1] ? "warn" : "bad";
    if (flags.length && st === "ok") st = "warn";
    let text = s <= CLEAN_MAX ? `综合分 ${s}（≤${CLEAN_MAX} 算低）` : `综合分 ${s}，高于 ${CLEAN_MAX}`;
    if (flags.length) text += "；" + flags.join("、");
    add("score", label, st, text);
  }

  label = "地区合格";
  const cc = typeof country === "string" && /^[A-Za-z]{2}$/.test(country) ? country.toUpperCase() : null;
  if (!cc) add("region", label, "unk", "数据源没有给出国家 / 地区");
  else if (cc in GPT_BLOCKED) add("region", label, "bad", `出口在${GPT_BLOCKED[cc]}：Claude 和 ChatGPT 都不对中国大陆、香港和澳门提供服务`);
  else add("region", label, "ok", COUNTRY_ZH[cc] || cc);

  const has = st => checks.some(c => c.state === st);
  const names = st => checks.filter(c => c.state === st).map(c => c.label).join("；");
  let state, text;
  if (has("bad")) [state, text] = ["dirty", "没通过：" + names("bad") + (has("warn") ? "。有疑点：" + names("warn") : "")];
  else if (has("warn")) [state, text] = ["doubt", "有疑点：" + names("warn") + (has("unk") ? "。无法确认：" + names("unk") : "")];
  else if (has("unk")) [state, text] = ["unknown", "数据不足，无法确认：" + names("unk")];
  else [state, text] = ["clean", "四项全部通过"];
  return { state, title: CLEAN_TITLE[state], text, checks };
}

/** 测速评级（用户 10-26：视频媒体要延迟最低、带宽最大）。ms 为延迟（毫秒），mbps 为带宽，没测出为 null。
 *  带宽和延迟各分三档，取较差的一档；只测出一项就只看那一项，都没测出为 unknown。返回 {state: fast/ok/slow/unknown, label, text}。 */
function speedGrade(ms, mbps) {
  ms = num(ms);
  mbps = num(mbps);
  if (ms === null && mbps === null) return { state: "unknown", label: SPEED_LABEL.unknown, text: "测速失败" };
  const bw = mbps === null ? null : mbps >= SPEED.fast_mbps ? 2 : mbps >= SPEED.ok_mbps ? 1 : 0;
  const lat = ms === null ? null : ms <= SPEED.fast_ms ? 2 : ms <= SPEED.ok_ms ? 1 : 0;
  const state = ["slow", "ok", "fast"][Math.min(...[bw, lat].filter(x => x !== null))];
  const parts = [mbps === null ? "带宽没测出" : mbps >= SPEED.fast_mbps ? "够看 4K" : mbps >= SPEED.ok_mbps ? "够看 1080p"
    : mbps >= SPEED.min_mbps ? "够看 720p" : "看视频会卡"];
  if (lat === 0) parts.push("延迟偏高");
  else if (lat === 1) parts.push("延迟一般");
  else if (ms === null) parts.push("延迟没测出");
  return { state, label: SPEED_LABEL[state], text: parts.join("，") };
}

// ───────── 历史对比 ─────────
function loadHistory() {
  const h = store.get("history", []);
  return Array.isArray(h) ? h.filter(isObj) : [];
}
const isReliable = h => !(h.unreliable || h.level === "数据不足");

/** 对比上一次可靠的检测记录，判断这次变化是「节点换了出口 IP」还是「IP 没变、数据库重新分类了」。
 *  dcNow：本次数据中心维度的结论（true/false，意见不一或无数据为 null）；
 *  sources：本次成功参与判定的数据源。两次成功的数据源不同时判定依据不同，不能直接比较。 */
function diagnoseChange(history, ip, verdict, dcNow, sources) {
  const level = verdict.level;
  if (level === "数据不足") return { changed: false, skipped: true, reason: "本次风控数据不足，不与历史对比，也不写入历史记录。" };
  const prev = [...history].reverse().find(isReliable);
  if (!prev) return null;
  if (Array.isArray(prev.sources) && [...prev.sources].sort().join() !== [...sources].sort().join()) {
    const gone = prev.sources.filter(s => !sources.includes(s)).sort();
    const added = sources.filter(s => !prev.sources.includes(s)).sort();
    const diff = [gone.length ? `少了 ${gone.join("、")}` : "", added.length ? `多了 ${added.join("、")}` : ""].filter(Boolean).join("；");
    return { changed: false, skipped: true, reason: `本次成功的数据源和上次（${prev.time || "—"}）不同（${diff}），判定依据不一样，暂不对比。` };
  }
  const levelChanged = prev.level !== level;
  const dcChanged = typeof prev.is_datacenter === "boolean" && dcNow !== null && prev.is_datacenter !== dcNow;
  if (!levelChanged && !dcChanged) return { changed: false, prev_time: prev.time, prev_ip: prev.ip, cur_ip: ip, same_ip: prev.ip === ip };

  const prevRank = LEVEL_RANK[prev.level] ?? 0, curRank = LEVEL_RANK[level] ?? 0;
  let badge, title, text;
  if (prev.ip !== ip) {
    // 手机上切节点很常见，不能默认当成节点自己漂移
    badge = "info";
    title = "出口 IP 换了，不是数据库的问题";
    text = `上次检测出口 IP 是 ${prev.ip || "—"}，这次是 ${ip}。如果你刚手动切换过节点，这是正常的，结论以本次为准。`
      + "如果没切换过，说明节点自己换了后端服务器，常见原因是客户端里用的是「自动测速 / 策略组」，"
      + "或者订阅把住宅 IP 和机房 IP 混在一起分配；想固定出口，就选定单一节点，不用自动选优。";
  } else {
    badge = curRank > prevRank ? "bad" : curRank < prevRank ? "ok" : "info";
    title = "出口 IP 没变，是风控数据库重新分类了";
    const yesNo = b => (b ? "是" : "否");
    const what = levelChanged ? `判定从「${prev.level || "—"}」改成了「${level}」`
      : `「数据中心」一项从「${yesNo(prev.is_datacenter)}」变成了「${yesNo(dcNow)}」（总体等级没变）`;
    text = `出口 IP 仍是 ${ip}，用的数据源也和上次一样，但${what}——这是数据库自己定期重新扫描 IP 段导致的，与你的网络设置无关，`
      + "无法通过换节点解决，只能等它下次再更新，或换一个 IP 段本身更干净的节点。";
  }
  return { changed: true, badge, title, text, prev_time: prev.time, prev_level: prev.level, cur_level: level };
}

// ───────── HTML 片段 ─────────
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = n => String(n).padStart(2, "0");
const fmtTime = (d, sec) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
  + (sec ? `:${pad(d.getSeconds())}` : "");

/** 首屏只在出口 IP 或结论变了时显示历史对比，其余情况（第一次记录、数据源不同、都没变）只放进「详细数据」。 */
const diagWorthShowing = diag => !!diag && !diag.skipped && (diag.changed || !diag.same_ip);

/** flat 为 true 时用折叠区里的浅底样式，否则是首屏的毛玻璃卡片。 */
function renderDiagnosis(diag, flat) {
  const box = flat ? "diag-flat" : "diag-box";
  if (diag === null) {
    return `<div class="${box} diag-info"><div class="diag-title">已建立检测基线</div>`
      + '<div class="diag-body">这是这台设备上的第一次记录，后续再检测时会自动对比，判断评分变化究竟是「节点换了 IP」还是「数据库重新分类」。</div></div>';
  }
  if (diag.skipped) return `<div class="${box} diag-info"><div class="diag-body">${esc(diag.reason)}</div></div>`;
  if (!diag.changed) {
    const when = esc(diag.prev_time || "—");
    if (!diag.same_ip) {
      return `<div class="${box} diag-info"><div class="diag-title">出口 IP 换了，判定结果一致</div>`
        + `<div class="diag-body">与上次检测（${when}）相比，出口 IP 从 ${esc(diag.prev_ip || "—")} 换成了 ${esc(diag.cur_ip)}。</div></div>`;
    }
    return `<div class="${box} diag-info"><div class="diag-body">与上次检测（${when}）相比，出口 IP 和判定结果都没变。</div>`
      + '<div class="diag-meta">如果你刚切换过节点：同一订阅的多个节点常常共用同一个出口，结果不变是正常的。'
      + "想确认，换一个不同地区或机房的节点再测。</div></div>";
  }
  return `<div class="${box} diag-${diag.badge}"><div class="diag-title">${esc(diag.title)}</div>`
    + `<div class="diag-body">${esc(diag.text)}</div>`
    + `<div class="diag-meta">上次检测：${esc(diag.prev_time || "—")}（${esc(diag.prev_level || "—")}） → 本次：${esc(diag.cur_level)}</div></div>`;
}

/** 返回 [ASN 号如 "AS7018", 运营方名称]。兼容 ipapi.is 带 key 的对象格式和匿名的字符串格式。 */
function asnInfo(src) {
  const ipapi = src["ipapi.is"];
  const num = g(ipapi, "asn", "asn");
  if (num) return [`AS${num}`, g(ipapi, "asn", "org") || "—"];
  for (const s of [g(ipapi, "asn"), g(src.ipinfo, "org")]) {
    const m = typeof s === "string" ? /^(AS\d+)\s*(.*)$/.exec(s) : null;
    if (m) return [m[1], m[2] || "—"];
  }
  for (const [n, org] of [[g(src.iplocate, "asn", "asn"), g(src.iplocate, "asn", "name")],
                          [g(src.ipquery, "isp", "asn"), g(src.ipquery, "isp", "org")],
                          [g(src.freeipapi, "asn"), g(src.freeipapi, "asnOrganization")]]) {
    if (n) return [/^\d+$/.test(String(n)) ? `AS${n}` : String(n), org || "—"];
  }
  return ["—", "—"];
}

/** iplocate 的公司类型优先，其次 ipapi.is（带 key 时）的公司 / ASN 类型。 */
function netTypeZh(src) {
  for (const t of [g(src.iplocate, "company", "type"), g(src.iplocate, "asn", "type"),
                   g(src["ipapi.is"], "company", "type"), g(src["ipapi.is"], "asn", "type")]) {
    if (t) return NET_TYPE_ZH[String(t).toLowerCase()] || String(t);
  }
  return "—";
}

/** 「国家 · 地区 · 城市」，取第一个有数据的源。 */
function place(src) {
  for (const [cc, region, city] of [
    [g(src.ipinfo, "country"), g(src.ipinfo, "region"), g(src.ipinfo, "city")],
    [g(src.iplocate, "country_code"), g(src.iplocate, "subdivision"), g(src.iplocate, "city")],
    [g(src.ipquery, "location", "country_code"), g(src.ipquery, "location", "state"), g(src.ipquery, "location", "city")],
    [g(src.freeipapi, "countryCode"), g(src.freeipapi, "regionName"), g(src.freeipapi, "cityName")],
  ]) {
    if (typeof cc === "string" && cc) {
      const parts = [COUNTRY_ZH[cc.toUpperCase()] || cc, region, city]
        .filter(p => (typeof p === "string" || typeof p === "number") && p !== "").map(String);
      return [...new Set(parts)].join(" · "); // 去掉重复的地区名（如 香港 · Hong Kong · Hong Kong）
    }
  }
  return "—";
}

/** 国家代码：依次取 iplocate、ip-api、ip2location、ipquery、freeipapi、ipinfo 中第一个有值的（顺序同桌面版，手机上没有的源自然跳过）。 */
function countryCode(src) {
  for (const cc of [g(src.iplocate, "country_code"), g(src["ip-api"], "countryCode"), g(src.ip2location, "country_code"),
                    g(src.ipquery, "location", "country_code"), g(src.freeipapi, "countryCode"), g(src.ipinfo, "country")]) {
    if (typeof cc === "string" && /^[A-Za-z]{2}$/.test(cc)) return cc.toUpperCase();
  }
  return null;
}

const GPT_BADGE = { ok: ["✓", "可用", "v-ok"], bad: ["✗", "不可用", "v-bad"], unknown: ["?", "无法判断", "v-unk"], down: ["×", "连不上", "v-bad"] };
// 「绝对干净」各状态的符号、颜色类和背景色调；检查项的符号
const CLEAN_UI = { clean: ["✓", "v-ok", "ok"], doubt: ["!", "v-warn", "warn"], dirty: ["✗", "v-bad", "bad"], unknown: ["?", "v-unk", ""] };
const CHK_MARK = { ok: "✓", warn: "!", bad: "✗", unk: "?" };
const fmtMs = ms => (num(ms) === null ? "—" : `${Math.round(ms)} ms`);
const fmtMbps = x => (num(x) === null ? "—" : `${x < 10 ? Math.round(x * 10) / 10 : Math.round(x)} Mbps`);

const staleNote = stale => (stale.length
  ? `<div class="relay">${esc(stale.join("、"))}这次没能换新连接（本页能用的新域名用完了）。如果你刚切换过节点，结果可能还是切换前的；把本页从后台划掉、重新打开再测。</div>`
  : "");

/** AI 块里的 ChatGPT 一行：出口在不在中国大陆 / 香港 / 澳门（机房也行，按 chatgptCheck），和 Claude 同不同出口只做灰色说明。 */
function renderGptRow(gpt, src) {
  if (!gpt) return "";
  const [mark, label, cls] = GPT_BADGE[gpt.state];
  let loc = src ? place(src) : "—";
  if (loc === "—") loc = gpt.place || "";
  const det = [loc, gpt.ip ? gpt.kind : ""].filter(Boolean).join(" · ");
  const head = `<div class="gpt-row gpt-${gpt.state}"><span class="gpt-name">ChatGPT</span><span class="gpt-state ${cls}">${mark} ${label}</span>`;
  // 和 Claude 同出口时 IP、地区就是上面那一行，不再重复
  if (gpt.ip && gpt.same_as_claude) return head + `<span class="gpt-det">${esc(gpt.state === "ok" ? gpt.note : gpt.text)}</span></div>`;
  return head + (gpt.ip ? `<span class="gpt-det"><span class="mono">${esc(gpt.ip)}</span>${det ? ` · ${esc(det)}` : ""}</span>` : "")
    + `<div class="gpt-note">${esc(gpt.state === "ok" ? gpt.note || gpt.text : gpt.text)}</div></div>`;
}

const AI_HEAD = '<div class="blk-head"><div class="blk-title">AI 出口</div><div class="blk-hint">Claude 只走家宽，要绝对干净</div></div>';

/** ① 不通时的 AI 块：不显示 IP 和检查项，只说明线路按设计断开（AI_DOWN），不会改走别的出口。 */
function renderAiDownBlock(gptRow, stale) {
  return `<section class="blk ai-blk">${AI_HEAD}
  <div class="ai-status v-warn"><span class="v-mark">!</span><div><div class="v-level">${esc(AI_DOWN.title)}</div>`
    + `<div class="v-sentence">Claude × 连不上</div></div></div>
  <div class="ai-down-text">${esc(AI_DOWN.text)}</div>${gptRow}${staleNote(stale)}
</section>`;
}

/** AI 块：「绝对干净」大结论 + 四项检查 + 出口 IP 一行 + ChatGPT 一行，评分依据折叠在最后。 */
function renderAiBlock(ip, a, clean, gptRow, stale) {
  const { src, verdict: v, conf, agree } = a;
  const [mark, cls] = CLEAN_UI[clean.state];
  const [asn, org] = asnInfo(src);
  const exitBits = [place(src), asn !== "—" ? `${asn} ${org}` : org, netTypeZh(src)].filter(x => x && x !== "—");
  const relay = yn(g(src.iplocate, "privacy", "is_icloud_relay"))
    ? '<div class="relay">这是 iCloud 专用代理（Private Relay）的 IP，不是你代理节点的出口。想测节点，请在「设置 › 顶部你的名字 › iCloud › 专用代理」里暂时关掉，或换个浏览器打开本页。</div>'
    : "";
  const why = `可信度${conf.level}` + (agree.total && v.level in BANDS ? ` · ${agree.agree}/${agree.total} 个源一致` : "");
  const checks = clean.checks.map(c => `<li class="chk c-${c.state}"><span class="chk-mark">${CHK_MARK[c.state]}</span>`
    + `<span class="chk-label">${esc(c.label)}</span><span class="chk-text">${esc(c.text)}</span></li>`).join("");
  return `<section class="blk ai-blk">${AI_HEAD}
  <div class="ai-status ${cls}"><span class="v-mark">${mark}</span><div><div class="v-level">${esc(clean.title)}</div>`
    + `<div class="v-sentence">${esc(clean.text)}</div></div></div>
  <ul class="chk-list">${checks}</ul>
  <div class="ai-exit"><span class="mono">${esc(ip)}</span>${esc(exitBits.join(" · "))}</div>
  ${gptRow}${relay}${staleNote(stale)}
  ${renderBreakdown(a, why)}
</section>`;
}

const fmtPts = x => String(Math.round(x * 10) / 10);
const dimLabels = sev => DIMENSIONS.filter(([, , s]) => s === sev).map(([, zh]) => zh).join(" / ");

/** 主卡片里的「评分依据」：每个维度各源怎么判、各加几分，合计怎么落进结论区间，各源是否一致。 */
function renderBreakdown(a, hint) {
  const { ev, comp, agree, conf, verdict: v, failed } = a;
  const ST = { unknown: ["未知", "t-unk"], no: ["否", "t-ok"], yes: ["是", "t-bad"], doubt: ["存疑", "t-warn"] };
  const row = (k, tag, cls, pts, zero, sub, extraCls) =>
    `<div class="bd-row${extraCls || ""}"><div class="bd-k">${esc(k)}${tag ? `<span class="bd-tag ${cls}">${tag}</span>` : ""}</div>`
    + `<div class="bd-pts${zero ? " zero" : ""}">${esc(pts)}</div><div class="bd-sub">${esc(sub)}</div></div>`;

  const rows = DIMENSIONS.map(([k, zh, sev]) => {
    const votes = ev[k] || [];
    const st = dimState(votes);
    let [tag, cls] = ST[st];
    if (sev === "info" && st !== "unknown") cls = st === "no" ? "t-unk" : "t-info"; // 移动网络不是风险
    const part = comp.parts.find(p => p.key === k);
    const pts = !(sev in DIM_WEIGHT) ? "不计分" : part ? `+${fmtPts(part.pts)}` : "—";
    let sub = votes.map(([s, x]) => `${s} ${x ? "是" : "否"}`).join(" · ");
    if (part && part.yes) sub += `（满分 ${part.w} × ${part.yes}/${part.n}）`;
    if (!votes.length) sub = KEY_ONLY_DIMS.has(k) && !ipapiKey() ? "需在「设置」填 ipapi.is key" : "没有数据源给出判断";
    return row(zh, tag, cls, pts, !part || !part.pts, sub);
  });
  const ipq = comp.parts.find(p => p.key === "ipquery");
  rows.push(ipq ? row("ipquery 风险分", "", "", `+${fmtPts(ipq.pts)}`, !ipq.pts, `${ipq.raw}/100 × ${IPQUERY_WEIGHT}`)
    : row("ipquery 风险分", "", "", "—", true, "没有返回分数"));
  let totalSub;
  if (!comp.band) totalSub = "风控数据不足，不给综合分";
  else {
    const [lo, hi] = comp.band, r = fmtPts(comp.raw);
    totalSub = comp.raw < lo ? `合计 ${r}，低于「${v.level}」区间下限，按 ${lo} 计`
      : comp.raw > hi ? `合计 ${r}，超过「${v.level}」区间上限，按 ${hi} 计`
      : `合计 ${r}，在「${v.level}」区间 ${lo}–${hi} 内`;
  }
  rows.push(row("综合分", "", "", comp.score ?? "—", false, totalSub, " bd-total"));

  const agreeRows = agree.per.map(p => `<li><span class="sa-mark ${p.against.length ? "sa-no" : "sa-ok"}">${p.against.length ? "≠" : "✓"}</span>`
    + `<span class="sa-name">${esc(p.src)}</span><span class="sa-txt">${p.against.length ? `${esc(p.against.join("、"))}和多数意见不同` : "和多数意见一致"}</span></li>`)
    .concat(failed.map(s => `<li><span class="sa-mark sa-fail">×</span><span class="sa-name">${esc(s)}</span><span class="sa-txt">查询失败，没有参与</span></li>`));

  return `<details class="why"><summary>评分依据<span class="sum-hint">${esc(hint || "每个数据源怎么判")}</span></summary><div class="why-body">
    <div class="why-formula">综合分 0–100，越低越干净。每个风险项按认为「是」的数据源占比折算：${esc(dimLabels("critical"))} 满分 ${DIM_WEIGHT.critical}，`
    + `${esc(dimLabels("risk"))} 满分 ${DIM_WEIGHT.risk}；再加 ipquery 风险分 × ${IPQUERY_WEIGHT}。合计落进结论等级的区间：`
    + "较为干净 0–33 · 中等风险 34–66 · 高风险 67–100，所以分数颜色和结论一定一致。结论等级本身由多源投票决定，规则和桌面版相同。</div>"
    + `<div class="bd-list">${rows.join("")}</div>`
    + `<div class="why-h">可信度${esc(conf.level)}：${esc(conf.why)}</div>`
    + `<ul class="src-agree">${agreeRows.join("")}</ul>`
    + "</div></details>";
}

/** 每条线路的 {ip, verdict, score, src}；没测到 IP 的线路为 null。同一 IP 只判定一次。
 *  另外按 IP 建索引（lineV[ip]），给 ChatGPT 小卡片取国家和机房投票用。 */
function lineVerdicts(ip, main, lines, extra) {
  const byIp = ip ? { [ip]: { ip, verdict: main.verdict, score: main.comp.score, src: main.src, ev: main.ev } } : {};
  for (const rip of Object.keys(extra)) {
    if (rip === ip) continue;
    const a = assess(extra[rip] || {});
    byIp[rip] = { ip: rip, verdict: a.verdict, score: a.comp.score, src: a.src, ev: a.ev };
  }
  const out = Object.fromEntries(LINES.map(l => {
    const rip = (lines[l.id] || {}).ip;
    return [l.id, rip ? (byIp[rip] || { ip: rip, verdict: { level: "未知", color: "v-unk", sentence: "未来得及查询数据源" }, score: null, src: {} }) : null];
  }));
  return { lines: out, byIp };
}

/** 视频媒体 / 其他外网里的一行：线路名、地区、延迟、带宽、评级，下面是提示（同出口、地区不符、测速出口和回显不一致）。 */
function renderSpeedRow(l, info, meta, v, sp) {
  const gr = speedGrade(sp ? sp.ms : null, sp ? sp.mbps : null);
  const cc = v ? countryCode(v.src) : null;
  const kind = v && v.ev ? ({ yes: "机房", no: "家宽" }[dimState(v.ev.datacenter || [])] || "") : "";
  const sub = [cc ? COUNTRY_ZH[cc] || cc : "", kind, l.group].filter(Boolean).join(" · ");
  const notes = [];
  if (!meta.ip) notes.push(["warn", `没取到这条线路的出口：${meta.error || "回显服务不可达"}`]);
  for (const t of info.notes) notes.push([info.level === "warn" ? "warn" : "info", t]);
  // 只有带 trace 的线路（其他外网）知道测速连接的出口，才核对；视频、TikTok 的测速地址没有 trace
  if (l.speed && l.speed.trace && sp && sp.ip && meta.ip && sp.ip !== meta.ip) {
    notes.push(["warn", "测速时这条线路的出口和回显到的不一样：可能沿用了切换节点前的旧连接（把本页从后台划掉重开），测速结果仅供参考"]);
  }
  if (sp && sp.error) notes.push([gr.state === "unknown" ? "warn" : "info", `${gr.state === "unknown" ? "测速失败" : "部分测速失败"}：${sp.error}`]);
  const val = (x, text) => (num(x) === null ? '<div class="sp-v none">—</div>'
    : `<div class="sp-v">${esc(text.split(" ")[0])}<small>${esc(text.split(" ")[1])}</small></div>`);
  return `<div class="sp-row"><div class="sp-name"><div class="sp-title">${esc(l.title)}</div><div class="sp-sub">${esc(sub)}</div></div>`
    + `<div class="sp-lat">${val(sp && sp.ms, fmtMs(sp && sp.ms))}<div class="sp-k">延迟</div></div>`
    + `<div class="sp-bw">${val(sp && sp.mbps, fmtMbps(sp && sp.mbps))}<div class="sp-k">带宽</div></div>`
    + `<div class="sp-grade g-${gr.state}">${esc(gr.label)}<span>${esc(gr.text)}</span></div>`
    + (notes.length ? `<div class="sp-notes">${notes.map(([c, t]) => `<div class="sp-note n-${c}">${esc(t)}</div>`).join("")}</div>` : "")
    + "</div>";
}

/** 视频媒体（YouTube / Telegram、TikTok）和其他外网两块；同出口有问题时视频块顶上加横幅。手机上读不到节点名。 */
function renderMedia(lines, lv, ge, speed, stale) {
  const row = id => renderSpeedRow(LINES.find(l => l.id === id), ge.lines[id], lines[id] || {}, lv[id], speed[id]);
  const banner = ge.banner ? `<div class="ln-banner">⚠ ${esc(ge.banner)}</div>` : "";
  return '<section class="blk media-blk"><div class="blk-head"><div class="blk-title">视频媒体</div>'
    + `<div class="blk-hint">延迟越低、带宽越大越好</div></div>${banner}${staleNote(stale)}${row("video")}${row("tiktok")}</section>`
    + '<section class="blk other-blk"><div class="blk-head"><div class="blk-title">其他外网</div>'
    + `<div class="blk-hint">没单独分流的网站都走这里</div></div>${row("other")}</section>`;
}

const LV_CLS = { "v-ok": "lv-ok", "v-warn": "lv-warn", "v-bad": "lv-bad", "v-unk": "lv-unk" };

/** 「详细数据」里的线路明细：每条线路的回显域名和出口、这个出口的干净度判定、测速域名和结果。 */
function renderLineTable(lines, lv, speed) {
  const rows = [...LINES, CHATGPT_LINE].map(l => {
    const m = lines[l.id] || {}, sp = speed[l.id];
    const v = m.ip ? lv.byIp[m.ip] || lv.lines[l.id] : null;
    const via = l.id === "ai" && m.down ? "线路不通（Claude 连不上）" : m.ip ? `回显经 ${m.host || "—"}` : `失败：${m.error || "—"}`;
    const where = v ? place(v.src) : "—";
    const judge = v && v.verdict
      ? `<div class="rt-sub"><span class="${LV_CLS[v.verdict.color] || "lv-unk"}">${esc(v.verdict.level)}${v.score != null ? ` · ${v.score} 分` : ""}</span>`
        + ` · ${esc(v.verdict.sentence)}</div>` : "";
    const spTxt = sp ? `测速经 ${sp.host}${sp.ip ? `（出口 ${sp.ip}）` : ""}：延迟 ${fmtMs(sp.ms)} · 带宽 ${fmtMbps(sp.mbps)}`
      + (sp.error ? ` · ${sp.error}` : "") : "";
    return `<tr><td class="kv-k">${esc(l.title || l.name)}<div class="rt-sub">${esc(l.group)}</div></td>`
      + `<td class="kv-v"><span class="mono">${esc(m.ip || "—")}</span>`
      + (where !== "—" ? `<div class="rt-sub">${esc(where)}</div>` : "") + judge
      + `<div class="rt-sub">${esc(via)}</div>${spTxt ? `<div class="rt-sub">${esc(spTxt)}</div>` : ""}</td></tr>`;
  });
  return `<div class="src-card"><table class="kv-table">${rows.join("")}</table></div>`;
}

/** 递归把对象渲染成中文 key-value 表。 */
function renderDictTable(d) {
  const rows = [];
  for (const [k, v] of Object.entries(d)) {
    if (k.startsWith("_")) continue; // 内部标记（如缓存时间），不展示
    const label = esc(KEY_ZH[k] || k);
    if (isObj(v)) {
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v kv-nested">${renderDictTable(v)}</td></tr>`);
    } else if (Array.isArray(v)) {
      const items = v.map(it => `<li>${esc(typeof it === "object" ? JSON.stringify(it) : it)}</li>`).join("");
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v">${v.length ? `<ul class="kv-list">${items}</ul>` : "—"}</td></tr>`);
    } else {
      // 风险类字段：是 红，否 绿；其他字段不上色
      const flag = yn(v);
      const cls = flag !== null && RISK_FIELDS.has(k) ? (flag ? " kv-bad" : " kv-ok") : "";
      rows.push(`<tr><td class="kv-k">${label}</td><td class="kv-v${cls}">${esc(zhValue(k, v))}</td></tr>`);
    }
  }
  return `<table class="kv-table">${rows.join("")}</table>`;
}

function renderSourceCard(s, ip, result) {
  let sub = `来源：${s.key}`;
  if (s.key === "ipapi.is" && !ipapiKey()) sub += "（未配置 key，只有归属信息）";
  if (isObj(result) && "_cache_age" in result) sub += ` · 缓存结果（${Math.max(1, Math.floor(result._cache_age / 60))} 分钟前）`;
  const link = s.link.replace("{ip}", encodeURIComponent(ip));
  const body = result instanceof Error ? `<div class="src-err">获取失败：${esc(result.message)}</div>`
    : isObj(result) ? renderDictTable(result) : '<div class="src-err">未查询</div>';
  return `<div class="src-card"><div class="src-head"><div class="src-title">${esc(s.zh)}</div><div class="src-sub">${esc(sub)}</div>`
    + `<a class="src-link" href="${esc(link)}" target="_blank" rel="noopener">查看原始页面 ↗</a></div>${body}</div>`;
}

function renderExternal(ip) {
  return '<div class="ex-list">' + ANTIBOT_SITES.map(([name, tpl, desc]) =>
    `<a class="ex-row" href="${esc(tpl.replace("{ip}", encodeURIComponent(ip)))}" target="_blank" rel="noopener">`
    + `<div class="ex-name">${esc(name)}</div><div class="ex-desc">${esc(desc)}</div><div class="ex-arrow">›</div></a>`).join("") + "</div>";
}

function plain(obj) {
  if (obj instanceof Error) return `Error: ${obj.message}`;
  if (Array.isArray(obj)) return obj.map(plain);
  if (obj && typeof obj === "object") return Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, plain(v)]));
  return obj;
}

function buildReport(run, runNo) {
  const { ip, results, routes, extra, lines, stale, speed } = run;
  const now = new Date();
  const down = !ip; // ① 线路不通：不显示 IP / 检查项、不写 ① 的历史，其他线路照常
  const main = down ? null : assess(results);
  let diag = null;
  if (!down) {
    const asBool = { yes: true, no: false }; // 意见不一或无数据记为 null，不能记成「否」
    const dcNow = asBool[dimState(main.ev.datacenter)] ?? null;
    // 历史记录只记 ① 线路；没有 line 字段的旧记录当作 ①（升级前测的是 🌍，升级后第一次可能提示 IP 变了）
    const history = loadHistory();
    diag = diagnoseChange(history.filter(h => (h.line || "ai") === "ai"), ip, main.verdict, dcNow, main.ok);
    if (main.verdict.level !== "数据不足") {
      history.push({
        time: fmtTime(now, true), line: "ai", ip, level: main.verdict.level, is_datacenter: dcNow,
        is_vpn: asBool[dimState(main.ev.vpn)] ?? null, risk_score: main.score, sources: main.ok,
      });
      store.set("history", history.slice(-HISTORY_MAX));
    }
  }

  const lv = lineVerdicts(ip, main, lines, extra);
  const countries = Object.fromEntries(Object.values(lv.byIp).map(v => [v.ip, countryCode(v.src)]));
  // ① 不通时 lv.lines.ai 为 null，同出口判定不把 ① 算进去
  const ge = groupExits(Object.fromEntries(LINES.map(l => [l.id, lv.lines[l.id] ? lv.lines[l.id].ip : null])), countries);
  // ChatGPT：只判出口在不在中国大陆 / 香港 / 澳门，机房不扣分；不参与综合分、历史和同出口判定
  const gl = lines.chatgpt || null;
  const gv = gl && gl.ip ? lv.byIp[gl.ip] : null;
  const gDc = gv && gv.ev ? ({ yes: true, no: false }[dimState(gv.ev.datacenter || [])] ?? null) : null;
  const gpt = gl ? chatgptCheck(gl.ip, gv ? countryCode(gv.src) : null, gDc, ip) : null;
  const gptRow = renderGptRow(gpt, gv ? gv.src : null);
  // AI 出口「绝对干净」四项检查；背景色块跟着它变色
  const clean = down ? null : aiClean(main.ev, main.comp.score, countryCode(main.src));
  document.body.dataset.tone = down ? "warn" : CLEAN_UI[clean.state][2];

  const raw = JSON.stringify({ "Claude 出口": plain(results), "绝对干净": clean, "ChatGPT 出口判定": gpt, 线路: plain(lines),
    测速: speed, 同出口判定: ge, 探针原始结果: plain(routes), 其他线路数据: plain(extra) }, null, 2);
  const meta = `<div class="run-meta">检测时间 ${esc(fmtTime(now, true))} · 本页第 ${runNo} 次检测</div>`;
  const lineTable = '<div class="more-h">各线路的出口与测速<span class="st-hint">（回显域名、出口判定、测速域名）</span></div>'
    + renderLineTable(lines, lv, speed);
  const tail = '<div class="more-note" style="margin-top:10px">视频线路测 YouTube 自己的图片服务器（i.ytimg.com），TikTok 线路测 TikTok 自己的 CDN，'
    + "其他外网用 Cloudflare 测速，都按现有分流规则走各自线路；延迟是同一条连接上几次小请求的中位数，"
    + `带宽是并发下载最多 ${SPEED.seconds} 秒或 ${Math.round(SPEED.max_bytes / 1e6)} MB 的平均速度。手机网页读不到代理 App 里的节点名，只显示检测结果。</div>`
    + `<details class="raw"><summary>原始 JSON</summary><pre>${esc(raw)}</pre></details>`
    + "</div></details>";
  // 没能换新连接的线路：Claude / ChatGPT 的提示放在 AI 块，其他放在视频块
  const isAi = n => n in AI_POOLS;
  const media = renderMedia(lines, lv.lines, ge, speed, stale.filter(n => !isAi(n)));

  if (down) {
    return renderAiDownBlock(gptRow, stale.filter(isAi)) + media + meta
      + '<details class="more"><summary>详细数据<span class="sum-hint">各线路出口与测速 · 原始 JSON</span></summary><div class="more-body">'
      + `<div class="more-h">历史对比</div><div class="more-note">${esc(AI_DOWN.title)}，本次不记录、不做历史对比。</div>`
      + lineTable + tail;
  }

  const cards = activeSources().map(s => renderSourceCard(s, ip, results[s.key])).join("");
  const keyNote = ipapiKey() ? ""
    : '<div class="more-note">ipapi.is 没填 key 时只给归属信息、不参与判定，所以没有查询；在「设置」里填 key 后参与判定。</div>';
  const showDiag = diagWorthShowing(diag); // IP 或结论变了才上首屏

  return renderAiBlock(ip, main, clean, gptRow, stale.filter(isAi))
    + (showDiag ? renderDiagnosis(diag, false) : "")
    + media + meta
    + '<details class="more"><summary>详细数据<span class="sum-hint">历史对比 · 各线路出口与测速 · 数据源原始返回 · 外部检测网站</span></summary><div class="more-body">'
    + (showDiag ? "" : '<div class="more-h">历史对比</div>' + renderDiagnosis(diag, true))
    + lineTable
    + '<div class="more-h">数据源原始返回<span class="st-hint">（Claude 出口，字段名已翻译为中文）</span></div>' + keyNote + cards
    + '<div class="more-h">外部检测网站</div>' + renderExternal(ip)
    + tail;
}

// ───────── 页面控制 ─────────
const $ = id => document.getElementById(id);
let running = false;
let runCount = 0;

/** force：手动点「重新检测」时为 true，数据源一律重新查，不用缓存。 */
async function start(force) {
  if (running) return;
  running = true;
  runCount += 1;
  $("rerun").disabled = true;
  $("report").innerHTML = `<div class="progress"><div class="pg-title">正在第 ${runCount} 次检测</div><ul class="pg-log" id="pg-log"></ul></div>`;
  window.scrollTo(0, 0);
  const thisRun = runCount;
  const log = (text, cls) => {
    const ul = $("pg-log");
    if (!ul || thisRun !== runCount) return; // 上一次检测超时后才回来的请求，不往这次的日志里写
    const li = document.createElement("li");
    li.textContent = text;
    if (cls) li.className = cls;
    ul.appendChild(li);
  };
  try {
    const run = await runAll(log, force);
    $("report").innerHTML = buildReport(run, runCount);
    document.title = `IP 体检 · ${run.ip || AI_DOWN.title}`;
    if (force) haptic({ ok: "success", warn: "warn", bad: "error" }[document.body.dataset.tone] || "warn");
  } catch (e) {
    $("report").innerHTML = `<div class="fatal">检测失败：${esc(e.message)}<div class="diag-body">`
      + "检查一下手机网络或代理是否正常，然后点「重新检测」。</div></div>";
    if (force) haptic("error");
  } finally {
    running = false;
    $("rerun").disabled = false;
    refreshSettings();
  }
}

// ───────── 震动反馈 ─────────
// 安卓用 navigator.vibrate；iPhone 的 Safari 不支持它，但点一下系统开关控件（<input switch>）
// 会带原生触感，借这个来震。不支持的设备上什么也不发生。
const hapticsOn = () => store.get("haptics", true) !== false;
const HAPTIC = { tap: [8], success: [10, 70, 10], warn: [12, 70, 12, 70, 12], error: [30, 80, 30] };

function iosTick() {
  try {
    const label = document.createElement("label");
    label.setAttribute("aria-hidden", "true");
    label.style.display = "none";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.setAttribute("switch", "");
    label.appendChild(input);
    document.head.appendChild(label);
    label.click();
    label.remove();
  } catch (e) { /* 不支持就算了 */ }
}

function haptic(kind) {
  if (!hapticsOn()) return;
  const pattern = HAPTIC[kind] || HAPTIC.tap;
  try {
    if (typeof navigator.vibrate === "function" && navigator.vibrate(pattern)) return;
  } catch (e) { /* 走下面的 iOS 办法 */ }
  // iOS 每次只能轻触一下，按图案里「震」的段数连点几下
  for (let i = 0; i < Math.ceil(pattern.length / 2); i++) setTimeout(iosTick, i * 110);
}

function refreshSettings() {
  $("key-input").value = ipapiKey();
  $("haptics-toggle").checked = hapticsOn();
  $("clear-history").textContent = `清除历史记录（${loadHistory().length} 条）`;
}

$("rerun").addEventListener("click", () => { haptic("tap"); start(true); });
$("haptics-toggle").addEventListener("change", e => {
  store.set("haptics", e.target.checked);
  haptic("tap"); // 开关本身在 iPhone 上就会震，安卓补一下
});
// 展开折叠、打开外部网站、查看原始页面时轻震
document.addEventListener("click", e => { if (e.target.closest("summary, .ex-row, .src-link")) haptic("tap"); });
$("key-save").addEventListener("click", () => {
  haptic("tap");
  const k = $("key-input").value.trim();
  if (k) store.set("ipapi_key", k); else store.del("ipapi_key");
  $("key-hint").textContent = k ? "已保存。下次检测起 ipapi.is 参与判定（数据源变了，第一次不做历史对比）。"
    : "已清除 key，ipapi.is 不再参与判定。";
  refreshSettings();
});
$("clear-history").addEventListener("click", () => {
  haptic("tap");
  if (confirm("清除这台设备上的全部检测历史？")) { store.del("history"); refreshSettings(); haptic("success"); }
});
$("clear-cache").addEventListener("click", () => { store.del("cache"); $("clear-cache").textContent = "缓存已清除"; haptic("success"); });

// 测试入口（不影响页面）
window.__ipcheck = { assess, computeVerdict, collectEvidence, diagnoseChange, dimState, place, asnInfo, netTypeZh,
  compositeScore, agreement, confidence, groupExits, aiExit, chatgptCheck, countryCode, aiClean, speedGrade };

refreshSettings();
start(false);
</script>
